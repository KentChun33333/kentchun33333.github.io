<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Technology Q&A v5 — LLM Cache</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f5;color:#152636;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{border-bottom:1px solid #dce2e5;background:white;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700}header span{color:#687780;font-weight:500}main{max-width:1100px;margin:auto;padding:24px 24px 12px}h1{font-size:clamp(24px,3.4vw,38px);letter-spacing:-.035em;margin:0 0 8px} .sub{margin:0 0 20px;color:#60717e;font-size:15px}.stage{background:white;border:1px solid #dce2e5;border-radius:16px;padding:12px;}.diagram{display:block;width:100%;height:auto;max-height:58vh;margin:auto}svg text{font-family:system-ui,sans-serif;fill:#233849}svg .label{font-size:19px;font-weight:700}svg .small{font-size:14px;fill:#627381}svg .lane{fill:#f7f9fa;stroke:#dce2e5}svg .box{fill:white;stroke:#aab9c5;stroke-width:1.5}svg .wire{fill:none;stroke:#b9c3cb;stroke-width:2;marker-end:url(#arrow)}svg .focus .box{fill:#fff1f1;stroke:#c52c2c;stroke-width:2.5}svg .past .box{fill:#edf8f2;stroke:#449675}svg .focus.wire{stroke:#c52c2c;stroke-width:3;marker-end:url(#redArrow)}svg .past.wire{stroke:#449675;marker-end:url(#greenArrow)}svg .part{transition:opacity .3s}svg .muted{opacity:.40}svg .token rect{fill:#f1f4f6;stroke:#b7c5d0}svg .token text{font:600 17px monospace}svg .token.reuse rect{fill:#e1f3e9;stroke:#449675}svg .token.fresh rect{fill:#eaf2fc;stroke:#5283b0}svg .token.reuse text{fill:#176947}svg .token.fresh text{fill:#285b88}.caption{display:grid;grid-template-columns:100px 1fr;gap:12px;align-items:center;border-top:1px solid #e2e7e9;padding:16px 12px 8px;min-height:84px}.caption small{font-size:11px;color:#b72828;font-weight:800;letter-spacing:.1em}.caption strong{font-size:clamp(17px,2vw,22px);display:block}.caption p{margin:4px 0 0;font-size:14px;color:#61717d}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}button{background:white;color:#152636;border:1px solid #cfd7de;border-radius:8px;padding:10px 15px;cursor:pointer;font:600 13px system-ui;min-height:42px}button.primary{background:#152636;color:white;border-color:#152636}button:disabled{opacity:.4;cursor:default}.progress{flex:1;height:5px;background:#e1e5e7;border-radius:10px;overflow:hidden;min-width:40px}.progress i{display:block;background:#c52c2c;height:100%;transition:width .3s}.count{font-size:12px;color:#61717d}.takeaway{text-align:center;font-size:14px;margin:16px 0;color:#536675}.takeaway b{color:#152636}@media(max-width:600px){main{padding:16px 10px}.stage{padding:5px}.diagram{max-height:none}.caption{grid-template-columns:1fr;gap:5px;padding:12px}.sub{font-size:13px}.controls{gap:5px}button{padding:9px 11px}.takeaway{text-align:left;padding:0 8px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><b>Technology Q&amp;A</b><span>LLM Cache · v5</span></header>
<main><h1>Prompt cache vs. token cache</h1><p class="sub">Two kinds of reuse. Two different levels of computation.</p>
<div class="stage">
<svg class="diagram" viewBox="0 0 840 590" role="img" aria-labelledby="dt dd">
<title id="dt">Layered LLM cache architecture</title><desc id="dd">An incoming request checks an application response cache. A hit returns a saved answer; a miss enters model inference where prefix and generation KV states may be reused.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#b9c3cb"/></marker><marker id="redArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#c52c2c"/></marker><marker id="greenArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#449675"/></marker></defs>
<g id="input" class="part"><rect class="box" x="315" y="9" width="210" height="43" rx="10"/><text class="label" x="420" y="36" text-anchor="middle">User prompt</text></g>
<rect class="lane" x="12" y="77" width="816" height="158" rx="12"/>
<text x="32" y="104" class="small" font-weight="700">01 / APPLICATION LEVEL</text>
<path id="in" class="wire part" d="M420 52 V120"/>
<g id="app" class="part"><rect class="box" x="277" y="121" width="286" height="66" rx="10"/><text class="label" x="420" y="148" text-anchor="middle">Prompt / response cache</text><text class="small" x="420" y="169" text-anchor="middle">Request → stored answer</text></g>
<path id="hit" class="wire part" d="M563 154 H615"/>
<text class="small" x="588" y="141" text-anchor="middle">HIT</text>
<g id="saved" class="part"><rect class="box" x="620" y="121" width="190" height="66" rx="10"/><text class="label" x="715" y="148" text-anchor="middle">Saved answer</text><text class="small" x="715" y="169" text-anchor="middle">No inference</text></g>
<path id="miss" class="wire part" d="M420 187 V273"/><text x="432" y="218" class="small">MISS</text>
<rect class="lane" x="12" y="254" width="816" height="324" rx="12"/>
<text class="small" x="32" y="281" font-weight="700">02 / MODEL INFERENCE LEVEL</text>
<g id="model" class="part"><rect class="box" x="315" y="285" width="210" height="40" rx="9"/><text class="label" x="420" y="311" text-anchor="middle">LLM server</text></g>
<path id="toPrefix" class="wire part" d="M420 325 V346"/>
<g id="prefix" class="part"><rect class="box" x="72" y="350" width="696" height="84" rx="10"/><text class="label" x="92" y="378">Prefill</text><text class="small" x="92" y="401">Prompt prefix KV</text>
<g id="pOld" class="token"><rect x="298" y="369" width="46" height="40" rx="6"/><rect x="352" y="369" width="46" height="40" rx="6"/><rect x="406" y="369" width="46" height="40" rx="6"/><rect x="460" y="369" width="46" height="40" rx="6"/><text x="321" y="395" text-anchor="middle">A</text><text x="375" y="395" text-anchor="middle">B</text><text x="429" y="395" text-anchor="middle">C</text><text x="483" y="395" text-anchor="middle">D</text></g><g id="pNew" class="token"><rect x="530" y="369" width="46" height="40" rx="6"/><rect x="584" y="369" width="46" height="40" rx="6"/><text x="553" y="395" text-anchor="middle">E</text><text x="607" y="395" text-anchor="middle">F</text></g><text id="pStatus" class="small" x="650" y="394">Prompt</text></g>
<path id="toDecode" class="wire part" d="M420 434 V452"/>
<g id="decode" class="part"><rect class="box" x="72" y="456" width="696" height="76" rx="10"/><text class="label" x="92" y="484">Decode</text><text class="small" x="92" y="507">Sequence KV</text><g id="dOld" class="token"><rect x="298" y="473" width="148" height="40" rx="6"/><text x="372" y="498" text-anchor="middle">Prompt KV</text><rect x="454" y="473" width="46" height="40" rx="6"/><rect x="508" y="473" width="46" height="40" rx="6"/><text x="477" y="498" text-anchor="middle">T1</text><text x="531" y="498" text-anchor="middle">T2</text></g><g id="dNew" class="token"><rect x="578" y="473" width="46" height="40" rx="6"/><text x="601" y="498" text-anchor="middle">T3</text></g><text id="dStatus" class="small" x="650" y="497">Output</text></g>
<path id="out" class="wire part" d="M420 532 V543"/><g id="answer" class="part"><rect class="box" x="315" y="546" width="210" height="25" rx="7"/><text x="420" y="564" text-anchor="middle" font-size="14" font-weight="700">New answer</text></g>
</svg>
<div class="caption" aria-live="polite"><small id="stageLabel">FRAME 01</small><div><strong id="headline">Check the response cache.</strong><p id="message">Look for a previously saved answer for this request.</p></div></div></div>
<div class="controls"><button id="prev">← Previous</button><button id="play" class="primary">Play</button><button id="next">Next →</button><button id="restart">Restart</button><div class="progress"><i id="bar"></i></div><span id="count" class="count"></span></div>
<p class="takeaway"><b>Prompt / response cache</b> reuses answers. <b>Token / KV cache</b> reuses attention states.</p></main>
<script>
const frames=[
{title:'Check the response cache.',message:'Look for a valid saved answer for the same request.',focus:['app','in'],past:['input']},
{title:'Cache hit: return the saved answer.',message:'The model does not need to run.',focus:['hit','saved'],past:['input','in','app']},
{title:'Alternative request: cache miss.',message:'No valid saved answer. Send the request to the LLM server.',focus:['miss','model'],past:['input','in','app']},
{title:'Reuse the matching prompt prefix.',message:'Reuse KV for A–D; compute only the new suffix E–F (illustrative tokens).',focus:['toPrefix','prefix'],past:['input','in','app','miss','model'],prefix:true},
{title:'Reuse KV while generating.',message:'Keep prompt and earlier output KV; compute the next token state.',focus:['toDecode','decode'],past:['input','in','app','miss','model','toPrefix','prefix'],prefix:true,decode:true},
{title:'Return a newly generated answer.',message:'Token caching reduces repeated computation; it does not reuse the final answer.',focus:['out','answer'],past:['input','in','app','miss','model','toPrefix','prefix','toDecode','decode'],prefix:true,decode:true}
];
let index=0,timer=null;const q=id=>document.getElementById(id);
function render(){const f=frames[index];document.querySelectorAll('.part').forEach(el=>{el.classList.remove('focus','past','muted');el.classList.add(f.focus.includes(el.id)?'focus':f.past.includes(el.id)?'past':'muted')});['pOld','pNew','dOld','dNew'].forEach((id,i)=>{q(id).classList.toggle(i%2?'fresh':'reuse',i<2?!!f.prefix:!!f.decode)});q('pStatus').textContent=f.prefix?'New KV':'Prompt';q('dStatus').textContent=f.decode?'New KV':'Output';q('headline').textContent=f.title;q('message').textContent=f.message;q('stageLabel').textContent='FRAME '+String(index+1).padStart(2,'0');q('count').textContent=(index+1)+' / '+frames.length;q('bar').style.width=(100*(index+1)/frames.length)+'%';q('prev').disabled=index===0;q('next').disabled=index===frames.length-1;q('play').textContent=timer?'Pause':'Play'}
function stop(){clearInterval(timer);timer=null}function step(n){stop();index=Math.max(0,Math.min(frames.length-1,index+n));render()}q('prev').onclick=()=>step(-1);q('next').onclick=()=>step(1);q('restart').onclick=()=>{stop();index=0;render()};q('play').onclick=()=>{if(timer){stop();render();return}if(index===frames.length-1)index=0;timer=setInterval(()=>{if(index<frames.length-1)index++;if(index===frames.length-1)stop();render()},3800);render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});render();
</script></body></html>
