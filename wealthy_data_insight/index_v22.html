<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="aura-version" content="22">
  <title>AURA Wealth Intelligence Agent · v22</title>
</head>
<body>
<script>
(async function loadV22() {
  const response = await fetch('index_v21.html', { cache: 'no-store' });

  if (!response.ok) {
    document.body.innerHTML = '<p style="font-family:Arial;padding:24px">Unable to load the v21 baseline.</p>';
    return;
  }

  let html = await response.text();

  html = html
    .replace('content="21"', 'content="22"')
    .replace('AURA Wealth Intelligence Agent · v21', 'AURA Wealth Intelligence Agent · v22')
    .replace('DEMO · GOVERNED DATA · V21', 'DEMO · GOVERNED DATA · V22');

  const v22Styles = `
<style id="v22Enhancements">
  /* v22 — same-canvas side panels */
  .stage-shell {
    transition: grid-template-columns .32s cubic-bezier(.2,.8,.2,1);
  }

  #page2 .stage-shell.v22-three-column {
    grid-template-columns: 250px minmax(0,1fr) 330px;
  }

  #page2 .stage-shell.v22-three-column.v22-right-collapsed {
    grid-template-columns: 250px minmax(0,1fr) 46px;
  }

  #page3 .stage-shell.v22-right-collapsed {
    grid-template-columns: minmax(0,1fr) 46px;
  }

  .v22-left-panel {
    position: sticky;
    top: 145px;
    overflow: hidden;
    padding: 0;
  }

  .v22-left-head {
    padding: 14px;
    background: #25292d;
    color: white;
    border-bottom: 1px solid #3b4045;
  }

  .v22-left-head .eyebrow { color: #ffb7b9; }

  .v22-left-head h2 {
    margin: 4px 0 3px;
    font-size: 16px;
  }

  .v22-left-head p {
    margin: 0;
    color: #c7cbcf;
    font-size: 9px;
    line-height: 1.45;
  }

  .v22-layers {
    display: grid;
    gap: 6px;
    padding: 10px;
  }

  .v22-layer {
    position: relative;
    width: 100%;
    border: 1px solid var(--line);
    border-left: 4px solid #c8cbcc;
    border-radius: 7px;
    background: #fafaf8;
    color: var(--ink);
    padding: 9px;
    text-align: left;
    transition: .18s ease;
  }

  .v22-layer:not(:last-child)::after {
    content: '↓';
    position: absolute;
    left: 14px;
    bottom: -13px;
    z-index: 2;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: white;
    display: grid;
    place-items: center;
    color: var(--muted);
    font-size: 9px;
  }

  .v22-layer.active {
    border-left-color: var(--red);
    background: #fff5f5;
  }

  .v22-layer.next {
    border-left-color: var(--blue);
    background: #f2f8fb;
  }

  .v22-layer.locked {
    opacity: .5;
    border-style: dashed;
    cursor: default;
  }

  .v22-layer-top {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: center;
  }

  .v22-layer-top b { font-size: 10px; }

  .v22-layer-status {
    font: 7px 'IBM Plex Mono';
    color: var(--muted);
  }

  .v22-layer.active .v22-layer-status { color: var(--red); }
  .v22-layer.next .v22-layer-status { color: var(--blue); }

  .v22-layer small {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-size: 8px;
    line-height: 1.4;
  }

  .v22-layer-gain {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 5px;
    margin-top: 7px;
    padding-top: 7px;
    border-top: 1px solid var(--line);
    font: 8px 'IBM Plex Mono';
  }

  .v22-layer-gain span { color: var(--muted); }
  .v22-layer-gain b { color: var(--green); font-size: 8px; }

  .v22-compounded {
    margin: 0 10px 10px;
    padding: 9px;
    border-left: 3px solid var(--blue);
    border-radius: 6px;
    background: #f2f8fb;
    font-size: 8px;
    line-height: 1.5;
  }

  .v22-compounded b {
    display: block;
    margin-bottom: 3px;
    font-size: 9px;
  }

  /* right drawer — open by default, slides right when collapsed */
  .right-panel {
    overflow: visible !important;
    min-width: 0;
  }

  .v22-right-inner {
    position: relative;
    overflow: hidden;
    border-radius: 9px;
    background: white;
    transition: transform .32s cubic-bezier(.2,.8,.2,1), opacity .22s ease;
  }

  .v22-panel-toggle {
    position: absolute;
    left: -18px;
    top: 18px;
    z-index: 5;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: white;
    color: var(--red);
    display: grid;
    place-items: center;
    font-size: 18px;
    box-shadow: 0 6px 18px rgba(25,25,25,.12);
    transition: transform .25s ease, left .25s ease;
  }

  .v22-right-collapsed .v22-right-inner {
    transform: translateX(calc(100% + 20px));
    opacity: 0;
    pointer-events: none;
  }

  .v22-right-collapsed .v22-panel-toggle {
    left: 4px;
    transform: rotate(180deg);
  }

  @media (max-width: 1050px) {
    #page2 .stage-shell.v22-three-column,
    #page2 .stage-shell.v22-three-column.v22-right-collapsed,
    #page3 .stage-shell.v22-right-collapsed {
      grid-template-columns: 1fr;
    }

    .v22-left-panel,
    .right-panel {
      position: static !important;
    }

    .v22-panel-toggle { display: none; }

    .v22-right-collapsed .v22-right-inner {
      transform: none;
      opacity: 1;
      pointer-events: auto;
    }
  }
</style>`;

  const v22Script = `
<script id="v22Behavior">
(function () {
  const $ = selector => document.querySelector(selector);
  const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];

  const layerConfig = [
    {
      source: 'CRM',
      label: 'Layer 1 · CRM',
      description: 'Structured people, household, entity and declared-role backbone.',
      gain: 'Baseline graph',
      cumulative: '18 clients · 24 declared links · confidence 62%'
    },
    {
      source: 'FileNet',
      label: 'Layer 2 · + FileNet',
      description: 'RM notes, trust documents and narrative evidence reveal hidden influence and family links.',
      gain: '+7 hidden links',
      cumulative: '5 relationship groups · 31 total links · confidence 81%'
    },
    {
      source: 'T24',
      label: 'Layer 3 · + T24',
      description: 'Account roles and recent activity validate operational proximity and current relevance.',
      gain: '+ behavioural proof',
      cumulative: '4 active bridges · recent liquidity signal · confidence 89%'
    },
    {
      source: 'HELIOS',
      label: 'Layer 4 · + HELIOS',
      description: 'Holdings, suitability and allocation context convert relationship intelligence into RM opportunity.',
      gain: '+ commercial action',
      cumulative: '3 immediate opportunities · S$122M AUM · confidence 94%'
    }
  ];

  function selectedSourcesFromPage2() {
    return $$('#sourceStates .source-state.on b').map(node => node.textContent.trim());
  }

  function renderLayers() {
    const host = $('#v22IntelligenceLayers');
    const summary = $('#v22CompoundedSummary');

    if (!host || !summary) return;

    const selected = selectedSourcesFromPage2();
    let firstMissingIndex = layerConfig.findIndex(layer => !selected.includes(layer.source));

    if (firstMissingIndex === -1) firstMissingIndex = layerConfig.length;

    host.innerHTML = layerConfig.map((layer, index) => {
      const isSelected = selected.includes(layer.source);
      const isNext = !isSelected && index === firstMissingIndex;
      const stateClass = isSelected ? 'active' : isNext ? 'next' : 'locked';
      const stateLabel = isSelected ? 'IN CASE' : isNext ? 'NEXT UNLOCK' : 'NOT SELECTED';

      return \
        '<button class="v22-layer ' + stateClass + '" type="button" data-v22-layer="' + layer.source + '" ' + (stateClass === 'locked' ? 'disabled' : '') + '>' +
          '<div class="v22-layer-top">' +
            '<b>' + layer.label + '</b>' +
            '<span class="v22-layer-status">' + stateLabel + '</span>' +
          '</div>' +
          '<small>' + layer.description + '</small>' +
          '<div class="v22-layer-gain">' +
            '<span>' + layer.gain + '</span>' +
            '<b>' + (isSelected ? 'ACTIVE' : 'PREVIEW') + '</b>' +
          '</div>' +
        '</button>';
    }).join('');

    const selectedLayers = layerConfig.filter(layer => selected.includes(layer.source));
    const deepest = selectedLayers[selectedLayers.length - 1] || layerConfig[0];

    summary.innerHTML =
      '<b>Current compounded view</b>' +
      deepest.cumulative + '<br>' +
      '<span class="muted">Each extra layer preserves earlier evidence and adds a new relationship or opportunity signal.</span>';

    $$('.v22-layer:not(.locked)', host).forEach(button => {
      button.addEventListener('click', () => {
        const source = button.dataset.v22Layer;
        const layer = layerConfig.find(item => item.source === source);
        const active = selected.includes(source);

        summary.innerHTML =
          '<b>' + layer.label + '</b>' +
          layer.description + '<br>' +
          '<span class="muted">' + (active ? layer.cumulative : 'Add ' + source + ' on Page 1 to unlock this layer.') + '</span>';
      });
    });
  }

  function enhancePage2() {
    const shell = $('#page2 .stage-shell');
    if (!shell || $('#v22LeftPanel')) return;

    shell.classList.add('v22-three-column');

    const left = document.createElement('aside');
    left.id = 'v22LeftPanel';
    left.className = 'panel v22-left-panel';
    left.setAttribute('aria-label', 'Case intelligence layers');
    left.innerHTML =
      '<div class="v22-left-head">' +
        '<div class="eyebrow">CASE INTELLIGENCE LAYERS</div>' +
        '<h2>Compounding data effect</h2>' +
        '<p>See how each added data-estate layer changes the case from a structured relationship map into actionable wealth intelligence.</p>' +
      '</div>' +
      '<div class="v22-layers" id="v22IntelligenceLayers"></div>' +
      '<div class="v22-compounded" id="v22CompoundedSummary"></div>';

    shell.insertBefore(left, shell.querySelector('.stage-main'));
    renderLayers();
  }

  function enhanceRightPanel(pageId, label) {
    const shell = $('#' + pageId + ' .stage-shell');
    const panel = $('#' + pageId + ' .right-panel');

    if (!shell || !panel || panel.querySelector('.v22-panel-toggle')) return;

    const children = [...panel.childNodes];
    const inner = document.createElement('div');
    inner.className = 'v22-right-inner';
    children.forEach(child => inner.appendChild(child));
    panel.appendChild(inner);

    const toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'v22-panel-toggle';
    toggle.textContent = '›';
    toggle.title = 'Collapse panel';
    toggle.setAttribute('aria-label', 'Collapse ' + label);
    panel.insertBefore(toggle, inner);

    toggle.addEventListener('click', () => {
      const collapsed = shell.classList.toggle('v22-right-collapsed');
      toggle.title = collapsed ? 'Expand panel' : 'Collapse panel';
      toggle.setAttribute('aria-label', (collapsed ? 'Expand ' : 'Collapse ') + label);
    });
  }

  function refreshAfterNavigation(event) {
    const openCase = event.target.closest('[data-open-case]');
    const page2Back = event.target.closest('#p3Back');

    if (openCase || page2Back) {
      setTimeout(renderLayers, 0);
    }
  }

  enhancePage2();
  enhanceRightPanel('page2', 'analyst feedback panel');
  enhanceRightPanel('page3', 'human review panel');
  renderLayers();

  document.addEventListener('click', refreshAfterNavigation, true);
})();
<\/script>`;

  html = html.replace('</head>', v22Styles + '\n</head>');
  html = html.replace('</body>', v22Script + '\n</body>');

  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
