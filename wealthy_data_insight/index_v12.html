<script>
(()=>{'use strict';const frame=document.getElementById('base');function boot(){const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d||!d.body){setTimeout(boot,80);return}if(d.getElementById('aura-v12-feedback-drawer'))return;d.title='Wealth Intelligence Agent · v12';const meta=d.querySelector('meta[name="aura-version"]');if(meta)meta.setAttribute('content','12');const mode=d.querySelector('.mode');if(mode)mode.textContent='DEMO · GOVERNED DATA · V12';const style=d.createElement('style');style.textContent=`#page2{transition:width .28s ease,transform .28s ease}#page2.v12-drawer-open{width:calc(100% - 360px)}.v12-feedback-open{display:inline-flex;align-items:center;gap:7px}.v12-feedback-open:before{content:'✦';font-size:11px}.v12-drawer{position:fixed;top:130px;right:0;bottom:0;width:348px;background:#fff;border-left:1px solid var(--line);box-shadow:-18px 0 38px rgba(16,27,39,.10);z-index:70;transform:translateX(102%);transition:transform .28s ease;display:flex;flex-direction:column}.v12-drawer.open{transform:translateX(0)}.v12-drawer-head{padding:17px 18px 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fff,#fafaf8);position:relative}.v12-drawer-head .eyebrow{margin-bottom:5px}.v12-drawer-head h2{font-size:18px;margin:0}.v12-drawer-head p{font-size:10px;color:var(--muted);line-height:1.5;margin:5px 28px 0 0}.v12-close{position:absolute;right:12px;top:12px;width:30px;height:30px;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--muted);font-size:18px;line-height:1}.v12-close:hover{border-color:var(--red);color:var(--red)}.v12-drawer-body{padding:14px 16px 18px;overflow:auto;display:grid;gap:12px}.v12-context{border-left:3px solid var(--red);background:#fff7f7;padding:10px 11px;border-radius:0 6px 6px 0;font-size:10px;line-height:1.5}.v12-context b{font:10px ui-monospace,monospace}.v12-context span{color:var(--muted)}.v12-review{border:1px solid var(--line);border-radius:7px;overflow:hidden}.v12-review h3{font: r';drawer.className='v12-drawer';drawer.setAttribute('aria-label','Page 2 analyst feedback panel');drawer.innerHTML=`<div class="v12-drawer-head"><button class="v12-close" id="v12Close" aria-label="Close analysis feedbacks">×</button><div class="eyebrow">P2 · ANALYST FEEDBACK</div><h2>Refine the search contract</h2><p>Use the existing Page 2 evidence and enter only the change you want the deeper agent to apply.</p></div><div class="v12-drawer-body"><div class="v12-context"><b id="v12Case">ACTIVE CASE · WDI-001</b><br><span id="v12Context">Page 2 · CRM + FileNet · 6-month lookback</span></div><section class="v12-review"><h3>REVIEW LIST</h3><article class="v12-review-item"><i>1</i><div><b>Evidence boundary</b><span>Confirm source coverage and relationship evidence before reuse.</span></div><em>REVIEW</em></article><article class="v12-review-item"><i>2</i><div><b>Human hypothesis</b><span>Separate confirmed links from inferred links and validation needs.</span></div><em>REVIEW</em></article><article class="v12-review-item"><i>3</i><div><b>Search scope</b><span>Check population, lookback, chain depth and confidence threshold.</span></div><em>REVIEW</em></article></section><div class="v12-prompt"><label for="v12Prompt">Analyst feedback</label><textarea id="v12Prompt" placeholder="Only enter the change, e.g. include trust beneficiaries; exclude shared addresses; prioritise bridges above S$20M AUM."></textarea><p class="v12-help">Active case context and the Page 2 search contract are attached automatically.</p></div><div class="v12-actions"><button class="btn" id="v12Finetune">Finetune</button><button class="btn v12-next" id="v12Next">Next → deeper analysis</button></div><div class="v12-log" id="v12Log"><div class="v12-log-head"><span>ASYNC MANAGER</span><b>APPLIED</b></div><div class="v12-progress"><i></i></div><p id="v12LogText">Feedback appended to the current Page 2 search contract.</p></div></div>`;d.body.appendChild(drawer);const p2=d.getElementById('page2'),actions= to deeper analysis.';q('#v12Prompt').value=''});q('#v12Next')?.addEventListener('click',()=>{closeDrawer();q('#approveP2')?.click()});const obs=new w.MutationObserver(()=>{if(!p2?.classList.contains('active'))closeDrawer();syncContext()});qs('.page').forEach(x=>obs.observe(x,{attributes:true,attributeFilter:['class']}));['#lookback','#confidence','#population','#jurisdiction'].forEach(sel=>q(sel)?.addEventListener('change',syncContext));qs('.source').forEach(x=>x.addEventListener('click',()=>setTimeout(syncContext,0)))}frame.addEventListener('load',()=>setTimeout(boot,120));})();
