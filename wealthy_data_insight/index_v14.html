<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="AURA Wealth Intelligence Agent v14 — case-managed navigation with optional Agent-work animations.">
<meta name="aura-version" content="14">
<title>Wealth Intelligence Agent · v14</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f4f1}#base{display:block;width:100%;height:100%;border:0;background:#f4f4f1}</style>
</head>
<body>
<iframe id="base" src="index_v13.html" title="AURA Wealth Intelligence Agent v14"></iframe>
<script>
(()=>{'use strict';
const outer=document.getElementById('base');
function deepest(doc){let d=doc;for(let i=0;i<4;i++){const f=d&&d.getElementById&&d.getElementById('base');if(!f||!f.contentDocument||!f.contentDocument.body)break;d=f.contentDocument}return d}
function boot(){
 const d=deepest(outer.contentDocument); if(!d||!d.body||!d.getElementById('page1')){setTimeout(boot,120);return}
 if(d.getElementById('aura-v14-flow-style'))return;
 const w=d.defaultView,$=(s,c=d)=>c.querySelector(s),$$=(s,c=d)=>Array.from(c.querySelectorAll(s));
 d.title='Wealth Intelligence Agent · v14'; const vm=$('meta[name="aura-version"]');if(vm)vm.content='14'; const mode=$('.mode');if(mode)mode.textContent='DEMO · GOVERNED DATA · V14';
 let v14ActiveRow=$('#baseCase');
 const style=d.createElement('style');style.id='aura-v14-flow-style';style.textContent=`
 #page2>.pagehead .page-actions,#page3>.pagehead .page-actions{display:none!important}
 .v14-flow-panel{position:fixed;right:18px;bottom:18px;z-index:68;width:300px;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 16px 42px rgba(16,27,39,.14);padding:12px;display:none}
 .v14-flow-panel.show{display:block}.v14-flow-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:9px}.v14-flow-head b{font-size:11px}.v14-flow-head span{font:8px ui-monospace,monospace;color:var(--muted)}
 .v14-flow-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.v14-flow-actions .btn{font-size:11px;min-height:36px;padding:8px 10px}.v14-flow-actions .next{background:var(--navy)}
 .v14-skip-note{font-size:9px;color:var(--muted);margin:8px 0 0;line-height:1.4}
 .v14-direct{border-color:#9eb7c9!important;color:#244a63!important;background:#f7fbfd!important}.v14-watch{color:var(--blue)!important}
 .v14-stage-ready{background:#eef7fb;color:#356078}
 .v14-case-hint{display:block;font-size:8px;color:var(--muted);margin-top:3px}
 #aura-v12-feedback-drawer .v12-actions{grid-template-columns:1fr 1fr 1fr!important}#aura-v12-feedback-drawer #v12Finetune{order:2}#aura-v12-feedback-drawer #v12Next{order:3}#aura-v12-feedback-drawer #v14DrawerBack{order:1}
 #aura-v12-feedback-drawer #v12Next{font-size:0}#aura-v12-feedback-drawer #v12Next:after{content:'Next';font-size:11px}
 @media(max-width:720px){.v14-flow-panel{left:10px;right:10px;width:auto;bottom:10px}}
 `;d.head.appendChild(style);
 function showPage(n){$$('.page').forEach((p,i)=>p.classList.toggle('active',i===n-1));$$('.step').forEach((s,i)=>{s.classList.toggle('active',i===n-1);s.classList.toggle('done',i<n-1)});w.scrollTo({top:0,behavior:'smooth'});updatePanels(n)}
 function updatePanels(n){const flow=$('#v14FlowPanel');if(flow)flow.classList.toggle('show',n===3);const drawer=$('#aura-v12-feedback-drawer');if(n!==2&&drawer){drawer.classList.remove('open');$('#page2')?.classList.remove('v12-drawer-open')}}
 function caseId(row){return row?.querySelector('.mono')?.textContent||'WDI-001'}
 function setRowReady(row,target){if(!row||row.cells.length<7)return;v14ActiveRow=row;row.dataset.v14Target=String(target);row.cells[3].innerHTML=`<span class="status v14-stage-ready">Page ${target} ready</span>`;row.cells[4].innerHTML='<span class="status">Ready</span>';row.cells[5].innerHTML=`<button class="agent-btn ready v14-watch">Watch Agent-work</button><small class="v14-case-hint">Optional</small>`;row.cells[6].innerHTML=`<button class="case-open v14-direct">Open Page ${target}</button><small class="v14-case-hint">Skip animation</small>`;bindV14Row(row)}
 function bindV14Row(row){const direct=row.querySelector('.v14-direct'),watch=row.querySelector('.v14-watch');if(direct&&!direct.dataset.v14){direct.dataset.v14='1';direct.addEventListener('click',e=>{e.stopPropagation();v14ActiveRow=row;showPage(Number(row.dataset.v14Target||2));if(Number(row.dataset.v14Target||2)===2){setTimeout(()=>{$('#v12OpenFeedback')?.click()},80)}})}if(watch&&!watch.dataset.v14){watch.dataset.v14='1';watch.addEventListener('click',e=>{e.stopPropagation();v14ActiveRow=row;const old=row.querySelector('[data-agent-row]');if(old&&old!==watch)old.click();else{const agent=$('#agent');if(agent){agent.classList.add('show');agent.setAttribute('aria-hidden','false');const t=$('#agentTitle');if(t)t.textContent=Number(row.dataset.v14Target||2)===2?'Mapping the intelligence request':'Running deeper opportunity analysis';const s=$('#agentStatus');if(s)s.textContent='Optional Agent-work preview';const c=$('#agentContinue');if(c){c.disabled=false;c.textContent='Return to case management'}}}})}}
 function prepareRows(){$$('#caseRows tr').forEach(row=>{if(row.dataset.v14Prepared)return;row.dataset.v14Prepared='1';const stage=row.cells?.[3]?.textContent||'';if(/Page 3|P2/.test(stage)&&!/Page 2/.test(stage))setRowReady(row,3);else setRowReady(row,2)})}
 const rowsObs=new w.MutationObserver(()=>{setTimeout(()=>{$$('#caseRows tr').forEach(row=>{if(!row.dataset.v14Prepared){row.dataset.v14Prepared='1';setRowReady(row,2)}})},0)});const tbody=$('#caseRows');if(tbody)rowsObs.observe(tbody,{childList:true});prepareRows();
 // Right drawer owns Page 2 Back / Next.
 const drawer=$('#aura-v12-feedback-drawer');if(drawer){const actions=$('.v12-actions',drawer);if(actions&&!$('#v14DrawerBack')){const back=d.createElement('button');back.id='v14DrawerBack';back.className='btn secondary';back.textContent='Back';actions.prepend(back);back.addEventListener('click',()=>{drawer.classList.remove('open');$('#page2')?.classList.remove('v12-drawer-open');showPage(1);$('#casebox')?.setAttribute('open','')})}const oldNext=$('#v12Next',drawer);if(oldNext){const next=oldNext.cloneNode(true);oldNext.replaceWith(next);next.addEventListener('click',()=>{const row=v14ActiveRow||$('#baseCase');setRowReady(row,3);drawer.classList.remove('open');$('#page2')?.classList.remove('v12-drawer-open');showPage(1);const cb=$('#casebox');if(cb)cb.open=true;row?.scrollIntoView({behavior:'smooth',block:'center'});const toast=$('#toast');if(toast){toast.textContent='Page 3 is ready · open directly or watch Agent-work';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}})}}
 // Page 3 gets the same compact right-side flow controls.
 const flow=d.createElement('aside');flow.id='v14FlowPanel';flow.className='v14-flow-panel';flow.innerHTML=`<div class="v14-flow-head"><b>FLOW CONTROL</b><span>PAGE 3</span></div><div class="v14-flow-actions"><button class="btn secondary" id="v14P3Back">Back</button><button class="btn next" id="v14P3Next">Next</button></div><p class="v14-skip-note">Back returns to Page 2. Next returns to Case Management; no animation starts automatically.</p>`;d.body.appendChild(flow);$('#v14P3Back').addEventListener('click',()=>{showPage(2);setTimeout(()=>{$('#v12OpenFeedback')?.click()},80)});$('#v14P3Next').addEventListener('click',()=>{showPage(1);const cb=$('#casebox');if(cb)cb.open=true;v14ActiveRow?.scrollIntoView({behavior:'smooth',block:'center'})});
 // Any animation close / continue always returns to case management rather than opening a page.
 const aclose=$('#agentClose'),acont=$('#agentContinue');if(aclose){aclose.addEventListener('click',()=>setTimeout(()=>{showPage(1);const cb=$('#casebox');if(cb)cb.open=true;v14ActiveRow?.scrollIntoView({behavior:'smooth',block:'center'})},0),true)}if(acont){acont.addEventListener('click',e=>{e.stopImmediatePropagation();$('#agent')?.classList.remove('show');$('#agent')?.setAttribute('aria-hidden','true');showPage(1);const cb=$('#casebox');if(cb)cb.open=true;v14ActiveRow?.scrollIntoView({behavior:'smooth',block:'center'})},true)}
 // Keep Page 2 drawer visible whenever Page 2 is opened directly.
 const pageObs=new w.MutationObserver(()=>{if($('#page2')?.classList.contains('active')){setTimeout(()=>{if(!drawer?.classList.contains('open'))$('#v12OpenFeedback')?.click()},60)}updatePanels($('#page3')?.classList.contains('active')?3:$('#page2')?.classList.contains('active')?2:1)});$$('.page').forEach(p=>pageObs.observe(p,{attributes:true,attributeFilter:['class']}));
 // Existing top buttons remain hidden; keyboard/table flow stays case-centric.
 updatePanels(1);
}
outer.addEventListener('load',()=>setTimeout(boot,200));setTimeout(boot,500);
})();
</script>
</body>
</html>
