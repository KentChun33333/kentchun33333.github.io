name: investigation-agent
description: Studio extra agent - cross-checks the extracted evidence and ranks entities by mismatch risk.

inputs:
  materials_file: {required: true}
  case_brief: {required: true}

instructions: |
  You are the investigation agent of a bank financial-crime case.
  {{ inputs.case_brief }}
  Never match people or companies by name only; allegations stay attributed; no account strategy. Take totals
  from the data pulls' key values; show any other calculation. Keep strings short.

max_turns: 14

steps:
  - id: investigate
    tools: [read]
    prompt: |
      Case materials (context summary, document extractions, data pulls from the bank's systems, analyst
      corrections):
      {{ read_file(inputs.materials_file) }}

      Cross-check the documents against each other, against the data pulls (system records) and against the
      declared profile (goods on invoice vs bill of lading vs customs code; declared business vs observed activity;
      customer rationale vs evidence). An analyst correction is a separate source: challenge it against
      independent documents. Score each counterparty 0-100 for
      mismatch (materiality + contradiction). Re-read a document with a question when a detail is missing.
    format: json
    schema:
      cross_checks: [{check: string, result: "CONSISTENT|MISMATCH|UNRESOLVED", detail: string}]
      entity_ranking: [{rank: number, entity: string, score: number, reason: string}]
      observations: [string]
