name: pdf-brief
version: 2
description: >
  PDF briefing Finite-State Workflow (100% fresh per state): read PDF(s) via parsing sub-agent ->
  draft brief.md -> verify numbers against source -> deterministic exit_gate.

runtime:
  max_cycles: 8
  max_retries_per_state: 2

max_turns: 20
entry: read

states:
  read:
    macro_phase: PLAN
    tools: [read]
    prompt: |
      Task: {{ prompt }}
      Workspace PDFs: {{ glob('*.pdf') | join(', ') }}.
      Read the relevant PDF(s) with the read tool: problem, approach, key results with numbers, and limitations.
    routes:
      default: draft

  draft:
    macro_phase: EXECUTE
    tools: [write]
    prompt: |
      Task: {{ prompt }}
      Extracted PDF notes:
      {{ steps.read.output }}

      Write a concise one-page brief to brief.md, then reply with it.
    routes:
      default: check

  check:
    macro_phase: EVALUATE
    tools: [read, edit]
    prompt: |
      Source PDF notes:
      {{ steps.read.output }}

      Check brief.md against the source notes (re-read the PDF if unsure): fix wrong or missing
      numbers and vague claims with edit, then summarize the changes.
    routes:
      default: exit_gate

  exit_gate:
    macro_phase: EXIT
    gate: true
    validators:
      - name: brief_exists
        file_exists: "brief.md"
    routes:
      passed: DONE
      failed: draft
