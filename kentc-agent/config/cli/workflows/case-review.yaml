name: case-review
version: 2
description: >
  Generic document-review Finite-State Workflow (100% fresh per state):
  inventory -> key_values -> analysis -> human review -> report -> deterministic exit_gate.

runtime:
  max_cycles: 12
  max_retries_per_state: 2

instructions: |
  Task: {{ prompt }}
  Cite [file, location] for every material fact, keep stated facts apart from inferences, and do all arithmetic
  with bash (python3 -c).

tools: [read, bash]
max_turns: 20
entry: inventory

states:
  inventory:
    macro_phase: PLAN
    tools: [bash]
    prompt: "List the files in the workspace and say what each one probably is and how it may help the task."
    routes:
      default: key_values

  key_values:
    macro_phase: EXECUTE
    tools: [read]
    prompt: |
      Workspace inventory:
      {{ steps.inventory.output }}

      Read every file: {{ documents('.') | join(', ') }}. Record the key values for the task (names,
      identifiers, dates, amounts, statements, red flags) with their location.
    format: json
    schema:
      facts: [{file: string, field: string, value: string, location: string}]
      gaps: [string]
    routes:
      default: analysis

  analysis:
    macro_phase: EVALUATE
    prompt: |
      Extracted key values:
      {{ steps.key_values.data | json }}

      Analyse the facts for the task: cross-check them, compute what is needed with bash, and give findings with
      confidence and open questions.
    format: json
    schema:
      findings: [{finding: string, evidence: string, confidence: number}]
      open_questions: [string]
      recommendation: string
    routes:
      default: review

  review:
    ask: |
      Findings:
      {% for f in data.findings %}- {{ f.finding }} ({{ f.confidence }})
      {% endfor %}Recommendation: {{ data.recommendation }}
      Feedback for the report, or "ok":
    default: ok
    routes:
      default: report

  report:
    macro_phase: EXECUTE
    tools: []
    prompt: |
      Extracted facts:
      {{ steps.key_values.data | json }}

      Analysis:
      {{ steps.analysis.data | json }}

      Reviewer feedback: {{ steps.review.output }}

      Write the case report in markdown (summary, findings with sources, open questions, recommendation),
      applying the reviewer's feedback. Reply with the report only.
    output: "reports/case-report.md"
    routes:
      default: exit_gate

  exit_gate:
    macro_phase: EXIT
    gate: true
    validators:
      - name: report_written
        file_exists: "reports/case-report.md"
    routes:
      passed: DONE
      failed: report
