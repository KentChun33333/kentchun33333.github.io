name: doc-agent
description: TER app, per-file agent of the Evidence lane - key values and anomalies from one document (re-run with analyst feedback).

inputs:
  file: {required: true, description: "document path inside the case folder"}
  case_brief: {required: true}
  feedback: {default: "", description: "analyst feedback on a previous extraction"}
  previous: {default: "", description: "the previous extraction (JSON) the feedback refers to"}

instructions: |
  You are the document agent of a bank financial-crime case.
  {{ inputs.case_brief }}
  Extract only what the document states. Every value carries its location (page, sheet + row, slide, e-mail part).
  Confidence is 0-100: how sure you are the value is read correctly and complete. Keep strings short; no
  repetition of the inputs. Read the file once; re-read it only with a precise question when a value is unclear.

max_turns: 6

steps:
  - id: extract
    tools: [read]
    prompt: |
      Read {{ inputs.file }} and extract its key values for the case: document type and reference, date, parties
      and roles, accounts, goods or services described, amounts and currency, payment terms, transactions (date,
      direction, counterparty, CIF, amount, reference), and documents promised but missing. Also list anomalies
      visible in the document itself (corrections or overwrites, internal contradictions, unusually simple terms
      for the value, templated or unsupported text).
      {% if inputs.feedback %}
      The analyst says the previous extraction was wrong or incomplete:
      {{ inputs.feedback }}
      Previous extraction: {{ inputs.previous }}
      Re-read the document for those points (read with a precise question) and correct them. Keep the other
      values unless they are also wrong.
      {% endif %}
    format: json
    schema:
      document_type: string
      reference: string
      summary: "two sentences"
      key_values: [{field: string, value: string, location: string, confidence: number}]
      anomalies: [string]
