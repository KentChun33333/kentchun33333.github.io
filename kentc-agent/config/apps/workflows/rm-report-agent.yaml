name: rm-report-agent
description: >
  RM insight app, report agent - the AURA pillar report (target client groups, relationship evidence, answer per
  target, evidence chain, provenance) in the studio report framework. An RM prompt (finetune) revises it.

inputs:
  materials_file: {required: true}
  case_brief: {required: true}
  instruction: {default: "", description: "the RM's prompt for a revision"}
  previous_report_file: {default: ""}

instructions: |
  You support a private-bank relationship manager.
  {{ inputs.case_brief }}
  - Use only the case materials. Every claim carries its source system (CRM, FileNet, T24, HELIOS) and
    [file, location].
  - Inferred links are never shown as facts: label each relationship and claim stated (in a record) or inferred.
  - News is context, not fact. A PEP or adverse-media signal turns the action into a controlled review; it is not
    an adverse conclusion.
  - A meeting mention never becomes a trading instruction; actions stay advisory until the RM approves.
  - Estimates (unallocated liquidity, ages, intent) are labelled as estimates and show their calculation, written
    out step by step so the RM can check it.
  - Analyst corrections are a separate source and win over the agents' readings. Keep strings short.

max_turns: 14

steps:
  - id: report
    tools: [read]
    prompt: |
      Case materials: documents carry each source file's facts, relationships and signals (read by the source
      agent); analyst corrections follow.
      {{ read_file(inputs.materials_file) }}
      {% if inputs.previous_report_file %}
      Previous report version:
      {{ read_file(inputs.previous_report_file) }}
      {% endif %}
      {% if inputs.instruction %}
      The RM's prompt: {{ inputs.instruction }}
      Change what the prompt asks for (depth, tone, audience, focus, a correction) and keep everything else.
      Answer the prompt in `reply`: what you changed and why, or the answer to the question.
      {% else %}
      Answer the question; `reply` says in one line what this version covers.
      {% endif %}
      Resolve aliases without inventing relationships, group people and entities into client groups, and rank at
      most 5 target clients by relevance and combined AUM, each with a metric (e.g. estimated unallocated
      liquidity = inflows minus earmarked / known uses, with the calculation), a score 0-100, why, caveats and
      advisory next RM actions. Give the evidence chain CRM -> FileNet -> T24 -> HELIOS per target. Note where two
      RMs must coordinate, and the provenance per source system.
      verdict: "Proceed" when the evidence supports outreach, "Controlled review" when a PEP / adverse-media signal
      or an inferred link carries the case, "Insufficient evidence" otherwise. requests: the documents or records
      that would close the gaps. questions: open questions for the RM. Re-read a file when a detail is missing.
    format: json
    schema:
      title: string
      verdict: "Proceed|Controlled review|Insufficient evidence"
      reply: "your answer to the RM (what changed and why)"
      requests: [{document: string, reason: string}]
      questions: [string]
      summary: string
      targets: [{rank: number, name: string, region: string, group: string, metric: string, calculation: string,
                 score: number, why: string, caveats: string, actions: string}]
      relationships: [{from: string, relation: string, to: string, kind: "stated|inferred", source: string}]
      evidence_chain: [{target: string, system: string, claim: string, source: string, kind: "stated|inferred"}]
      coordination: [string]
      provenance: [{system: string, files: string, items: number}]
      confidence: number
