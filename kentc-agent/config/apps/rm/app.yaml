# RM insight: relationship-management wealth insight (as in AURA v3-3 / DEV-001).
# Page 1: the RM's question and settings + source files (CRM / T24 exports, RM notes, trust documents, e-mails,
# news) · Page 2: per-source facts, relationships (stated vs inferred) and signals to verify · Page 3: the AURA
# pillar report; each prompt (finetune) is a new version.

title: RM insight
description: Wealth intelligence - CRM, FileNet, T24 and news sources into ranked target clients with evidence chains.
case: {label: Insight case ID, prefix: WDI-2026-}

fields:
  - name: question
    type: textarea
    required: true
    column: true
    default: >-
      Which client groups linked to the Tan family have new unallocated liquidity we should discuss in the next
      quarter, and who should coordinate the outreach?
  - {name: task_type, label: Task, type: select, column: true, default: Opportunity focus,
     options: [Opportunity focus, Risk focus, Investigation]}
  - {name: region, column: true, default: All regions}
  - {name: lookback, default: 12 months}
  - {name: aum_min, label: AUM threshold, default: S$20M+}
  - {name: audience, type: select, default: Relationship manager,
     options: [Relationship manager, Investment advisor, Compliance reviewer]}
  - {name: hypothesis, label: RM hypothesis, type: textarea}
  - {name: guardrails, wide: true, default: Advisory only; no trading instructions}

lanes:
  - name: sources
    hint: CRM / T24 exports, RM meeting notes, trust documents, e-mails, news → source agent (facts, links)
    required: true
    sample: ["*"]
    agent: source-agent                     # one job per file; no view: system + summary, facts, links, signals

sample: ../../../examples/rm-case

report:
  name: Wealth insight
  workflow: rm-report-agent
  label: Insight agent
  verdicts: {Proceed: ok, Controlled review: warn, Insufficient evidence: bad}
  hide: [confidence]
  view:                                              # the AURA pillars; coordination and provenance follow by default
    - {title: Answer, text: summary}
    - {title: Pillar 01 · Target client groups, table: targets, columns: [rank, name, region, group, metric, score]}
    - {title: Pillar 02 · Relationship evidence, table: relationships}
    - {title: Pillar 03 · Answer per target, cards: targets, kicker: group, head: name, score: score, body: why,
       notes: [calculation, caveats, actions]}
    - {title: Pillar 04 · Reasoning and evidence chain, table: evidence_chain}
