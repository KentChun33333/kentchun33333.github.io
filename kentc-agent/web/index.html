<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BANK · Agentic Studio</title>
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="bank-logo" aria-label="BANK"><i aria-hidden="true">B</i><span>BANK</span></div>
    <div class="brand-copy">Agentic Studio</div>
  </div>
  <div class="top-actions">
    <button class="top-action" id="backBtn" hidden>← Case table</button>
    <span class="top-group" id="p3Top" hidden>
      <select class="input version-pick" id="versionSel" aria-label="Report version"></select>
      <button class="btn green small" id="approveBtn" disabled>Approve</button>
      <a class="top-action" id="zipLink" href="#">Case ZIP</a>
      <button class="top-action" id="printBtn">Print</button>
    </span>
    <span class="pill" id="modelPill" title="LLM server"><span class="dot"></span><span>connecting…</span></span>
  </div>
</header>

<nav class="journey" aria-label="Workflow progress">
  <button class="journey-step active" data-page="1"><i>1</i><b>Cases</b></button>
  <button class="journey-step" data-page="2"><i>2</i><b>Verify</b></button>
  <button class="journey-step" data-page="3"><i>3</i><b id="journey3">Report</b></button>
</nav>

<main class="app">
  <!-- ============================================================ PAGE 1 -->
  <section class="page active" id="page1">
    <details class="new-case-panel" id="newCasePanel" open>
      <summary>NEW CASE</summary>
      <div class="app-pick">
        <div class="app-tabs" id="appPick" role="tablist" aria-label="App"></div>
        <button type="button" class="btn secondary small" id="sampleBtn">Sample bundle</button>
      </div>
      <form class="intake-layout" id="caseForm" autocomplete="off">
        <article class="card">
          <div class="form-grid" id="fieldGrid"></div>
        </article>
        <article class="card">
          <div class="lanes" id="intakeLanes"></div>
          <div class="pulls" id="intakePulls"></div>
          <div class="intake-footer">
            <span class="caption" id="stageCount"></span>
            <button type="submit" class="btn" id="submitCase">Upload &amp; start →</button>
          </div>
        </article>
      </form>
    </details>

    <section class="card">
      <div class="history-head">
        <h2>CASES</h2>
        <input class="input history-search" id="caseSearch" type="search" placeholder="Search case ID or field" aria-label="Search cases">
      </div>
      <div class="table-wrap">
        <table class="grid">
          <thead><tr><th>Case</th><th>App</th><th>Subject</th><th>Status</th><th>Verdict</th><th>Agent work</th><th>Action</th></tr></thead>
          <tbody id="queueBody"><tr><td colspan="7" class="empty">Loading cases…</td></tr></tbody>
        </table>
      </div>
    </section>
  </section>

  <!-- ============================================================ PAGE 2 -->
  <section class="page" id="page2">
    <div class="case-strip" id="strip2"></div>
    <div class="ready-bar" id="ready2"></div>
    <div class="review-layout">
      <div class="stack">
        <div class="stack" id="laneFolds"></div>
        <details class="card fold" open id="dataFold">
          <summary>DATA PULLS <span class="summary-meta" id="dataMeta"></span></summary>
          <div class="fold-body"><div class="data-grid" id="dataGrid"></div></div>
        </details>
        <details class="card fold" open id="factsFold">
          <summary>FACTS TO VERIFY <span class="summary-meta" id="factMeta"></span></summary>
          <div class="fold-body">
            <div class="actions filter-row" id="factFilter">
              <button class="seg active" data-filter="all">All</button><button class="seg" data-filter="low">Low confidence</button><button class="seg" data-filter="flagged">Flagged</button>
            </div>
            <div class="insights" id="facts"></div>
          </div>
        </details>
        <details class="card fold" open>
          <summary>FILES <span class="summary-meta" id="docMeta"></span></summary>
          <div class="fold-body"><div class="doc-grid" id="docGrid"></div></div>
        </details>
      </div>
      <aside class="drawer">
        <div class="drawer-body">
          <div><h3>ADD FILES</h3><div class="lanes compact" id="moreLanes"></div>
            <button class="btn dark" id="uploadMore" style="width:100%;margin-top:9px" disabled>Upload &amp; read</button></div>
          <div><h3 id="reportHead2">REPORT</h3><div class="extra-list" id="extraList2"></div>
            <button class="btn" id="genReport2" style="width:100%;margin-top:9px">Generate report →</button></div>
        </div>
      </aside>
    </div>
  </section>

  <!-- ============================================================ PAGE 3 -->
  <section class="page" id="page3">
    <div class="case-strip" id="strip3"></div>
    <div class="review-layout">
      <div class="stack" id="reportStack">
        <div class="banner" id="staleBanner" hidden></div>
        <section class="card" id="reportCard"><div id="reportView"></div></section>
      </div>
      <aside class="drawer prompt-panel" id="promptPanel" aria-label="Prompt">
        <header><b class="ph-text">Prompt</b>
          <button type="button" class="slide-btn" id="promptToggle" aria-controls="promptBody" aria-expanded="true"><span class="open-icon">⟩</span><span class="closed-label">✎ PROMPT</span></button></header>
        <div class="drawer-body" id="promptBody"></div>
      </aside>
    </div>
  </section>
</main>

<!-- ============================================================ AGENT WORK -->
<div class="backdrop" id="workBackdrop"></div>
<aside class="agent-work" id="agentWork" aria-label="Agent work">
  <div class="aw-head">
    <div><small id="awStage">AGENT WORK</small><h2 id="awTitle">—</h2><p id="awStatus"></p></div>
    <div class="actions"><button class="btn secondary small" id="awClose">Close</button></div>
  </div>
  <ul class="job-list dark" id="awJobs"></ul>
  <div class="live" id="awLive" hidden></div>
  <div class="feed" id="awFeed"></div>
</aside>

<div class="toast" id="toast" role="status"></div>
<script src="/assets/js/app.js"></script>
</body>
</html>
