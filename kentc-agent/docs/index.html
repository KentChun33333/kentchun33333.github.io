<section class="hero" aria-labelledby="title">
  <p class="eyebrow">核心設計說明 · 依目前程式實作整理</p>
  <h1 id="title">不是堆疊更多代理，<br>而是讓每一步都<em>有邊界、有依據、可追查。</em></h1>
  <p class="lead">目標：以<b>小型本機模型</b>完成需讀取上百份文件、上百次工具往返的<b>長任務</b>，且每個結論可回溯來源。三個約束貫穿全部設計：視窗有限、模型會出錯、輸入不可信。</p>
  <div class="psd">
    <div class="psd-item problem"><span>問題</span><p>W = 62,536 tokens。一件 40 人審查案：121 檔、約 242,000 字元，原始資料 ≈ 一個視窗；執行期累積 ≈ 200 萬 prompt tokens。模型會漏步、心算錯、重複指令、誤把注入文字當指令。</p></div>
    <div class="psd-item idea"><span>核心想法</span><p>單一主代理、四個工具。上下文由執行環境控制：縱向壓縮歷史、橫向外存大型結果、文件交隔離子代理；外部資料走受控步驟；權限隨看管程度收斂。</p></div>
    <div class="psd-item data"><span>依據</span><p>歷史 A/B（舊版 v1 已移除），同模型、同任務各 4 次：STR 中位數 v1 0.65、v2（現行 runtime 前身）0.60，不分勝負（v2 交檔較穩、v1 較守格式）；剩餘次數提醒使記憶回復 0/4 → 3/4。見 <a href="topics/eval.html" data-slug="eval">07 · 長任務記憶：摘要 → 主題筆記</a>。</p></div>
  </div>
  <div class="pills"><span class="pill">1 個主代理迴圈</span><span class="pill">4 個核心工具</span><span class="pill">2 個上下文方向：縱向／橫向</span><span class="pill">CLI · 工作流程 · Studio 三層</span><span class="pill">checkpoint ＋ 主題筆記壓縮</span><span class="pill">工作區 ＋ 工作階段記憶</span></div>
  <p class="scope"><b>範圍：</b><code>kentc-agent/src/kentc_agent/</code>（唯一 runtime，主題筆記壓縮；舊版摘要壓縮 v1 已移除），及其在 CLI 對話、工作流程、Studio 三種使用層的權限差異；含工作流程編排、網路研究步驟、Studio 應用框架（<code>src/kentc_studio/</code>）。不涵蓋各應用的業務判斷。</p>
</section>
