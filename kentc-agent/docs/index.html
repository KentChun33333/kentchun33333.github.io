<!-- ==================== TAB 1 HOME: kentc_agent ==================== -->
<template id="homeTpl-agent">
<section class="hero" aria-labelledby="title">
  <p class="eyebrow">TAB 1 · kentc_agent 單任務核心引擎（src/kentc_agent/）</p>
  <h1 id="title">不是堆疊更多代理，<br>而是讓每一步都<em>有邊界、有依據、可追查。</em></h1>
  <p class="lead">專注於<b>單一任務的長程可靠執行</b>：以小型本機模型完成需讀取上百份文件、上百次工具往返的長任務。三個約束貫穿全部設計：<b>視窗有限、模型會出錯、輸入不可信</b>。</p>
  <div class="psd">
    <div class="psd-item problem"><span>問題</span><p>W = 62,536 tokens。一件 40 人審查案：121 檔、約 242,000 字元，執行期累積 ≈ 200 萬 prompt tokens。小模型會漏步、心算錯、截斷寫檔、跨日日期漂移、重試堆疊重複提示。</p></div>
    <div class="psd-item idea"><span>核心想法</span><p>單一主代理迴圈（<code>loop.py</code>）＋ 四個核心工具。縱向採前景主題筆記壓縮與 <b>LSM Seal &amp; Roll</b>，橫向採大型結果外存與隔離文件子代理，並以固定需求釘選與原子 journal 守住不變量。</p></div>
    <div class="psd-item data"><span>依據</span><p>完整實作於 <code>src/kentc_agent/</code>（唯一 runtime；舊版單摘要 v1 已移除），由 285 項自動化回歸測試與歷史 A/B 實測驗證。</p></div>
  </div>
  <div class="pills">
    <span class="pill">loop.py 單主代理迴圈</span>
    <span class="pill">縱向主題壓縮 ＋ LSM 封存</span>
    <span class="pill">橫向大結果外存</span>
    <span class="pill">原子 append-only journal</span>
    <span class="pill">固定需求釘選 ＋ 跨日刷新</span>
    <span class="pill">4 核心工具 ＋ 隔離文件子代理</span>
  </div>
  <p class="scope"><b>本分頁範圍：</b>單任務引擎 <code>src/kentc_agent/</code>（<code>agent/loop.py</code>、<code>budget.py</code>、<code>executor.py</code>、<code>context/compaction.py</code>、<code>bigcontext.py</code>、<code>adapters/session.py</code>、<code>documents/</code>、<code>workflow.py</code>）。欲了解跨會話排程、全域記憶與 Studio 掛載，請切換上方 <b>Breezeman</b> 分頁。</p>
</section>

<!-- ==================== TAB 2 HOME: Breezeman ==================== -->
<template id="homeTpl-breezeman">
<section class="hero breezeman" aria-labelledby="title">
  <p class="eyebrow">TAB 2 · Breezeman 長程常駐平台（src/kentc_breezeman/）</p>
  <h1 id="title">單一 FastAPI 宿主，<br>把單任務引擎升級為<em>跨週排程與自我蒸餾系統。</em></h1>
  <p class="lead">Breezeman 不另造多代理框架，而是直接以 <code>kentc_agent</code> 作為每個 Task 的主代理，加上 <b>FastAPI/WebSocket 宿主層、雙獨立排程迴圈、非同步 Worker 熔斷結算、三軌全域記憶（Dreaming）與 Folder-as-Studio 內嵌掛載</b>。</p>
  <div class="psd">
    <div class="psd-item problem"><span>問題</span><p>系統常駐數週後同時面對四道失效：排程只看同步派發漏接 worker 故障、固定提示過大引發每次強制壓縮、數百份歷史 <code>.jsonl</code> 全量掃描拖垮 I/O、<code>INDEX.md</code> 撐爆視窗。</p></div>
    <div class="psd-item idea"><span>核心想法</span><p>排程與 Dreaming 雙迴圈隔離；<code>Chat._worker</code> 透過 <code>on_complete</code> + <code>settled_run_id</code> 無競態結算並觸發退避熔斷；Dreaming 採 O(1) <code>stat()</code> 快篩 ＋ BM25 兩階段檢索 ＋ 三軌冪等寫入；Studio 以資料夾內嵌掛載。</p></div>
    <div class="psd-item data"><span>依據</span><p>涵蓋 <code>src/kentc_breezeman/</code>（<code>app.py</code>、<code>runtime.py</code>、<code>dream.py</code>、<code>memory_store.py</code>、<code>studio.py</code>），由 <code>test_breezeman.py</code>、<code>test_breezeman_dream.py</code>、<code>test_breezeman_studio.py</code> 完整驗證。</p></div>
  </div>
  <div class="pills">
    <span class="pill">FastAPI + WebSocket 單一宿主</span>
    <span class="pill">Daemon Thread + on_complete 結算</span>
    <span class="pill">指數退避 ＋ 連續失敗熔斷</span>
    <span class="pill">O(1) stat 快篩 ＋ BM25 Top-K</span>
    <span class="pill">Fact / Pattern / SIM 三軌記憶</span>
    <span class="pill">Folder-as-Studio 唯讀記憶白名單</span>
  </div>
  <p class="scope"><b>本分頁範圍：</b><code>src/kentc_breezeman/</code> 的宿主架構、排程狀態機、離線 Dreaming 蒸餾管線，以及取代獨立伺服器的 <b>Folder-as-Studio</b>（<code>/studios/{id}/</code>）整合機制。底層上下文壓縮與工具迴圈請見 <b>kentc_agent</b> 分頁。</p>
</section>
