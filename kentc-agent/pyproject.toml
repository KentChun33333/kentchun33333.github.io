[project]
name = "kentc-agent"
version = "0.1.0"
description = "A simple pi-style agent runtime for any OpenAI-compatible LLM server (Strata, LiteLLM, vLLM): one main agent, four core tools, token-aware compaction, big-result routing, a parsing sub-agent for PDFs/images/large documents, YAML workflows with per-step tool limits, and key-free web research as a workflow step. Run with: kentc-agent --workspace DIR (or kentc-studio for the web UI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "pyyaml>=6",
    "jinja2>=3.1",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "extract-msg>=0.56.1",
    "python-pptx>=1.0.2",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.143.3",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
    "markdown>=3.11.1",
    "ddgs>=9.16",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kentc-agent = "kentc_agent.cli:main"
kentc-studio = "kentc_studio.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kentc_agent", "src/kentc_studio"]

[tool.hatch.build.targets.wheel.force-include]
"config/qwen38.yaml" = "kentc_agent/deployment_config/qwen38.yaml"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
