# TER review: Trigger Event Review of a bank financial-crime case (as in ter-bank-multi-agent-flow-v15.html).
# Page 1: case fields + Context / Evidence lanes + data pulls · Page 2: Trigger Context and document key values to
# verify · Page 3: the TER report with suggested next steps; each prompt is a new version.

title: TER review
description: Trigger Event Review - context and evidence documents plus core-banking pulls into a TER report.
case: {label: TER case ID, prefix: TER-2026-}
brief: >-
  Case {{ id }}, customer CIF {{ cif }}{% if customer %}; customer {{ customer }}{% endif %};
  review period {{ lookback_date }} to {{ start_date }}{% if review_scope %}; scope: {{ review_scope }}{% endif %}
  {%- if related_entity %}; related entity: {{ related_entity }}{% endif %}. Trigger: {{ trigger }}

fields:
  - {name: cif, label: Customer CIF, required: true, column: true, default: CIF-8842197}
  - {name: customer, label: Customer name, column: true, wide: true, default: Orchid Meridian Trading}
  - {name: start_date, label: Start date, type: date, required: true, default: "2026-07-01"}
  - {name: lookback_date, label: Lookback date, type: date, required: true, default: "2026-04-01"}
  - {name: related_entity, label: Related entity}
  - {name: review_scope, label: Review scope, default: Import activity and connected transactions}
  - name: trigger
    label: Trigger event
    type: textarea
    required: true
    wide: true
    default: >-
      Police intelligence: the Singapore account of UBO Tan Wei Ming may be compromised. The ML trigger model
      flagged a trade anomaly on recent import payments.

lanes:
  - name: context
    label: Context
    hint: Trigger e-mails, customer explanations, case notes → context agent
    required: true
    agent: context
    sample: ["*.eml", "*.msg"]
  - name: evidence
    label: Evidence
    hint: Invoices, contracts, B/L, customs, statements → doc agent (key values)
    agent: doc
    sample: ["*"]

sample: ../../examples/ter-case
pulls: [kyc_profile, txn_history, counterparties, monthly_activity, prior_alerts]

agents:
  context:
    workflow: workflows/context-agent.yaml
    label: Context agent
    per: lane
    view:
      - title: Trigger context
        kv: [trigger_type, trigger_source, trigger_event, profile_deviation, customer_explanation, routing_rationale]
      - {title: Matched parties, chips: matched_parties}
      - {title: Initial evidence gaps, list: evidence_gaps}
  doc:
    workflow: workflows/doc-agent.yaml
    label: Doc agent
    per: file
    view:
      - {kv: [document_type, reference, summary]}
      - {facts: key_values}
      - {title: Anomalies, list: anomalies}

report:
  name: TER report
  workflow: workflows/report-agent.yaml
  label: Report agent
  verdicts: {Agree: ok, Further investigation: warn}
  view:
    - {title: Assessment, kv: [typology, confidence]}
    - {title: Executive narrative, text: executive_narrative}
    - title: Trigger
      kv: trigger
      labels: {type: Trigger type, event: Trigger event}
    - title: Background
      kv: background
      labels: {owners_directors: Directors / UBO}
    - {title: KYC review, text: kyc_review}
    - title: Transaction review
      table: transactions
      columns: {date: Date, from: From, to: To, amount: Amount, result: Review result}
    - title: Justification and key risks
      cards: key_risks
      kicker: id
      head: title
      score: score
      body: reason
      notes: [evidence, gap]
    - {title: Recommended next step, kv: recommendation}

extras:
  investigation:
    workflow: workflows/investigation-agent.yaml
    label: Investigation agent (cross-checks, entity risk ranking)
  # openweb:
  #   url: http://research-host:9000/agent
  #   label: OpenWeb research agent (registry, adverse news)
  #   timeout: 1800
