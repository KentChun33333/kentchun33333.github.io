name: source-agent
description: RM insight app, per-file agent of the Sources lane - facts, relationships and signals from one source file.

inputs:
  file: {required: true, description: "source file inside the case folder"}
  case_brief: {required: true}
  feedback: {default: "", description: "analyst feedback on a previous reading"}
  previous: {default: "", description: "the previous result (JSON) the feedback refers to"}

instructions: |
  You are the source agent of a private-bank relationship-management insight case.
  {{ inputs.case_brief }}
  Extract only what the file states, each value with its location (page, sheet + row, e-mail part, paragraph).
  Confidence is 0-100: how sure you are the value is read correctly and complete. A relationship is "stated" when
  the file records it, "inferred" when you derive it; never present an inferred link as a fact. News is context,
  not fact. Keep strings short; no repetition of the inputs.

max_turns: 6

steps:
  - id: read
    tools: [read]
    prompt: |
      Read {{ inputs.file }}. Say which source system it comes from (CRM, FileNet document / note / e-mail, T24
      transactions, HELIOS news, or Other). Extract the facts that matter for the question: clients (name, ID,
      region, segment, AUM, RM, age), entities (companies, trusts, SPVs), liquidity events (client, date, amount,
      currency, in / out / earmarked / expected), stated interests; the relationships between people and entities;
      and signals (PEP, adverse media, corporate events, follow-ups promised).
      {% if inputs.feedback %}
      The analyst says the previous reading was wrong or incomplete:
      {{ inputs.feedback }}
      Previous result: {{ inputs.previous }}
      Re-read the file for those points (read with a precise question) and correct them. Keep the other values
      unless they are also wrong.
      {% endif %}
    format: json
    schema:
      system: "CRM|FileNet|T24|HELIOS|Other"
      summary: "two sentences"
      key_values: [{field: string, value: string, location: string, confidence: number}]
      relationships: [{from: string, relation: string, to: string, kind: "stated|inferred", location: string}]
      signals: [string]
