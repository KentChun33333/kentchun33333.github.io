# RM insight: relationship-management wealth insight (as in AURA v3-3 / DEV-001).
# Page 1: the RM's question and settings + source files (CRM / T24 exports, RM notes, trust documents, e-mails,
# news) · Page 2: per-source facts, relationships (stated vs inferred) and signals to verify · Page 3: the AURA
# pillar report; each prompt (finetune) is a new version.

title: RM insight
description: Wealth intelligence - CRM, FileNet, T24 and news sources into ranked target clients with evidence chains.
case: {label: Insight case ID, prefix: WDI-2026-}
brief: >-
  Case {{ id }} for a private-bank relationship manager ({{ audience }}). Question: {{ question }}
  Settings: lookback {{ lookback }}; AUM {{ aum_min }}; region {{ region }}; task {{ task_type }}.
  {%- if hypothesis %} RM hypothesis: {{ hypothesis }}.{% endif %}
  {%- if guardrails %} Guardrails: {{ guardrails }}.{% endif %}

fields:
  - name: question
    label: Question
    type: textarea
    required: true
    column: true
    wide: true
    default: >-
      Which client groups linked to the Tan family have new unallocated liquidity we should discuss in the next
      quarter, and who should coordinate the outreach?
  - {name: task_type, label: Task, type: select, column: true, default: Opportunity focus,
     options: [Opportunity focus, Risk focus, Investigation]}
  - {name: region, label: Region, column: true, default: All regions}
  - {name: lookback, label: Lookback, default: 12 months}
  - {name: aum_min, label: AUM threshold, default: S$20M+}
  - {name: audience, label: Audience, type: select, default: Relationship manager,
     options: [Relationship manager, Investment advisor, Compliance reviewer]}
  - {name: hypothesis, label: RM hypothesis, type: textarea, wide: true}
  - {name: guardrails, label: Guardrails, wide: true, default: Advisory only; no trading instructions}

lanes:
  - name: sources
    label: Sources
    hint: CRM / T24 exports, RM meeting notes, trust documents, e-mails, news → source agent (facts, links)
    required: true
    agent: source
    sample: ["*"]

sample: ../../examples/rm-case

agents:
  source:
    workflow: workflows/source-agent.yaml
    label: Source agent
    per: file
    view:
      - {kv: [system, summary]}
      - {facts: key_values}
      - title: Relationships
        table: relationships
        columns: {from: From, relation: Relation, to: To, kind: Stated / inferred, location: Location}
      - {title: Signals and follow-ups, list: signals}

report:
  name: Wealth insight
  workflow: workflows/report-agent.yaml
  label: Insight agent
  verdicts: {Proceed: ok, Controlled review: warn, Insufficient evidence: bad}
  view:
    - {title: Answer, text: summary}
    - {title: Assessment, kv: [confidence]}
    - title: Pillar 01 · Target client groups
      table: targets
      columns: {rank: Rank, name: Client, region: Region, group: Group, metric: Metric, score: Score}
    - title: Pillar 02 · Relationship evidence
      table: relationships
      columns: {from: From, relation: Relation, to: To, kind: Stated / inferred, source: Source}
    - title: Pillar 03 · Answer per target
      cards: targets
      kicker: group
      head: name
      score: score
      body: why
      notes: [calculation, caveats, actions]
    - title: Pillar 04 · Reasoning and evidence chain
      table: evidence_chain
      columns: {target: Target, system: System, claim: Claim, source: Source, kind: Stated / inferred}
    - {title: RM coordination, list: coordination}
    - title: Source provenance
      table: provenance
      columns: {system: Source system, files: Files, items: Evidence items}
