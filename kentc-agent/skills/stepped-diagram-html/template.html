<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How a Request Travels · stepped diagram template</title>
<style>
:root{
  --paper:#f4ebe0;--sheet:#f9f2e8;--card:#f8f0e6;--line:#ddd3c5;--line-strong:#c6bbac;--edge:#46413b;
  --ink:#1d1b18;--muted:#6f6961;--green:#cfe3b2;--green-3:#7fc278;--violet:#e7ddf5;--amber:#f6d58e;--rust:#d0683a;
  --face-top:#fbf6ef;--face-l:#e9dfd2;--face-r:#dcd1c3;
  --font:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;--radius:12px;
  --pop:1.5px 2.5px 0 var(--edge);--ease-out:cubic-bezier(.2,.7,.2,1);--ease-back:cubic-bezier(.34,1.56,.64,1);
  --ease-io:cubic-bezier(.65,0,.35,1);color-scheme:light;
}
:root[data-theme=dark]{
  --paper:#211e1a;--sheet:#28241f;--card:#26231e;--line:#342f28;--line-strong:#4f473d;--edge:#c6bfb7;
  --ink:#efe6d6;--muted:#a59d92;--green:#3b4a2c;--violet:#3a3247;--amber:#5a4724;
  --face-top:#3a352e;--face-l:#2e2a24;--face-r:#26231e;color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:13px/1.6 var(--font);transition:background .4s,color .4s}
header{display:flex;align-items:center;gap:12px;padding:12px 20px}
header h1{font-size:15px;margin:0;flex:1}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--edge);border-radius:8px;padding:6px 12px;
  cursor:pointer;box-shadow:var(--pop);transition:transform .15s var(--ease-out),box-shadow .15s}
button:hover{transform:translate(-1px,-1px);box-shadow:2.5px 3.5px 0 var(--edge)}
button:active{transform:translate(1px,1px);box-shadow:0 0 0 var(--edge)}
button:disabled{opacity:.45;pointer-events:none}
button:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.primary{background:var(--green)}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:0 20px 20px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--radius)}
.stage{display:flex;flex-direction:column;min-height:560px}
.metrics{display:flex;gap:8px;padding:12px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);border-radius:8px;padding:4px 10px;min-width:96px;background:var(--card)}
.chip small{display:block;font-size:9px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.chip b{display:inline-block}
.chip.changed{animation:chip-flash .7s var(--ease-out)} .chip.changed b{animation:value-in .35s var(--ease-out)}
svg{flex:1;width:100%;min-height:360px}
.node{transition:opacity .22s,transform .34s var(--ease-out)}
.node.off{opacity:0;transform:translateY(-10px);pointer-events:none}
.spot{transform-box:fill-box;transform-origin:center;animation:spot 1.1s var(--ease-out) forwards}
.link{stroke:var(--edge);stroke-width:1.5;stroke-dasharray:4 5;fill:none;transition:opacity .25s,stroke .5s}
.link.off{opacity:0}
.label rect{fill:var(--card);stroke:var(--edge);stroke-width:1.5}
.label text{fill:var(--ink);font:600 12px var(--font)}
.packet{fill:var(--rust);filter:drop-shadow(0 0 4px var(--rust))}
.packet.response{fill:var(--green-3);filter:drop-shadow(0 0 4px var(--green-3))}
.stepper{display:flex;gap:4px;padding:12px;border-top:1px solid var(--line);overflow-x:auto}
.stepper button{flex:1;min-width:44px;box-shadow:none;border-color:var(--line-strong);font-size:11px;padding:4px}
.stepper button[aria-current=step]{background:var(--green);border-color:var(--edge)}
.stepper button.done{background:var(--face-top)}
.panel{padding:16px;display:flex;flex-direction:column;gap:10px}
.panel .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}
.tag{border:1px solid var(--edge);border-radius:999px;padding:0 8px;font-size:10px;background:var(--violet)}
.panel h2{font-size:17px;margin:0}
.copy{min-height:150px}
.copy>*{animation:guide-in .34s var(--ease-out) both}
.copy>*:nth-child(2){animation-delay:.05s} .copy>*:nth-child(3){animation-delay:.1s}
.idea{background:var(--violet);border:1px solid var(--line-strong);border-radius:10px;padding:10px}
.idea small{display:block;font-size:9px;letter-spacing:.08em;color:var(--muted)}
.nav{display:flex;gap:8px;margin-top:auto}.nav .primary{flex:1}
kbd{border:1px solid var(--line-strong);border-radius:4px;padding:0 4px;font:inherit;font-size:10px}
.hint{color:var(--muted);font-size:10px;text-align:center}
@keyframes chip-flash{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green-3) 50%,transparent)}
  15%{box-shadow:0 0 0 4px color-mix(in srgb,var(--green-3) 35%,transparent);transform:translateY(-2px)}
  100%{box-shadow:0 0 0 10px transparent}}
@keyframes value-in{0%{opacity:0;transform:translateY(4px)}}
@keyframes spot{0%{opacity:0;transform:scale(.75)}20%{opacity:1}100%{opacity:0;transform:scale(1.4)}}
@keyframes guide-in{0%{opacity:0;transform:translateX(var(--slide,12px))}}
@media (max-width:880px){main{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>How a Request Travels</h1>
  <button id="replay" title="Replay step (R)">Replay</button>
  <button id="pause" title="Pause (Space)" aria-pressed="false">Pause</button>
  <button id="theme" title="Toggle theme" aria-label="Toggle dark theme">◐</button>
</header>
<main>
  <section class="card stage" aria-label="Diagram">
    <div class="metrics" id="metrics"></div>
    <svg id="stage" viewBox="-320 -170 640 400" role="img" aria-labelledby="step-title">
      <defs>
        <pattern id="iso-grid" width="40" height="20" patternUnits="userSpaceOnUse">
          <path d="M0 10 L20 0 L40 10 L20 20 Z" fill="none" stroke="var(--line)" stroke-width=".8"/>
        </pattern>
      </defs>
      <rect x="-320" y="-170" width="640" height="400" fill="url(#iso-grid)"/>
      <g id="links"></g><g id="nodes"></g><g id="fx"></g>
    </svg>
    <nav class="stepper" id="stepper" aria-label="Steps"></nav>
  </section>
  <aside class="card panel" aria-live="polite">
    <div class="meta"><span id="counter"></span><span class="tag" id="tag"></span></div>
    <div class="copy" id="copy"></div>
    <div class="nav"><button id="back">← Back</button><button class="primary" id="next"></button></div>
    <div class="hint"><kbd>←</kbd><kbd>→</kbd> step · <kbd>R</kbd> replay · <kbd>Space</kbd> pause</div>
  </aside>
</main>
<script>
// ---------- isometric projection: 2:1 dimetric, (i, j) on the floor grid, z up ----------
const TILE = 40;
const iso = (i, j, z = 0) => [(i - j) * TILE / 2, (i + j) * TILE / 4 - z];
const pts = list => list.map(p => p.join(',')).join(' ');
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (parent) parent.append(n);
  return n;
};

// a box of w×d tiles and height h at grid (i, j): three faces, drawn back to front
function box(g, i, j, w, d, h, top = 'var(--face-top)') {
  const A = iso(i, j, h), B = iso(i + w, j, h), C = iso(i + w, j + d, h), D = iso(i, j + d, h);
  const C0 = iso(i + w, j + d), D0 = iso(i, j + d), B0 = iso(i + w, j);
  const s = {stroke: 'var(--edge)', 'stroke-width': 1.5, 'stroke-linejoin': 'round'};
  el('polygon', {...s, points: pts([D, C, C0, D0]), fill: 'var(--face-l)'}, g);
  el('polygon', {...s, points: pts([B, C, C0, B0]), fill: 'var(--face-r)'}, g);
  el('polygon', {...s, points: pts([A, B, C, D]), fill: top}, g);
  return iso(i + w / 2, j + d / 2, h);   // top-face centre: anchor for labels and packets
}

function label(g, [x, y], text) {
  const t = el('g', {class: 'label', transform: `translate(${x} ${y - 28})`}, g);
  const w = text.length * 7.4 + 20;
  el('rect', {x: -w / 2, y: -12, width: w, height: 24, rx: 12}, t);
  el('text', {'text-anchor': 'middle', y: 4}, t).textContent = text;
}

// ---------- scene: nodes and links, declared once, toggled per step ----------
const NODES = {
  you:    {at: [-5, 3, 2, 2, 14], label: 'you'},
  dns:    {at: [-6, -4, 2, 2, 46], label: 'DNS resolver', top: 'var(--amber)'},
  server: {at: [2, -3, 2, 2, 56], label: 'web server', top: 'var(--green)'},
  db:     {at: [5, 1, 2, 2, 34], label: 'database', top: 'var(--violet)'},
};
const LINKS = {'you-dns': ['you', 'dns'], 'you-server': ['you', 'server'], 'server-db': ['server', 'db']};
const anchor = {}, nodeEl = {}, linkEl = {};
// painter's algorithm: draw far tiles (small i + j) first so nearer boxes overlap them correctly
for (const [id, n] of Object.entries(NODES).sort(([, a], [, b]) => a.at[0] + a.at[1] - b.at[0] - b.at[1])) {
  const g = el('g', {class: 'node off', 'data-id': id}, document.getElementById('nodes'));
  anchor[id] = box(g, ...n.at, n.top);
  label(g, anchor[id], n.label);
  nodeEl[id] = g;
}
for (const [id, [a, b]] of Object.entries(LINKS)) {
  const [x1, y1] = anchor[a], [x2, y2] = anchor[b];
  linkEl[id] = el('line', {class: 'link off', x1, y1, x2, y2}, document.getElementById('links'));
}

// ---------- the lesson: every step is pure data ----------
const STEPS = [
  {title: 'Users say the shop feels slow', tag: 'problem', show: ['you'], links: [],
   body: 'Follow one page load hop by hop to find where the time goes.',
   idea: 'Every web request is a conversation between machines; each hop costs time.', metrics: {}},
  {title: 'Find the address (DNS)', tag: 'technique', show: ['you', 'dns'], links: ['you-dns'],
   hops: [['you', 'dns', 20]], body: 'The browser asks a resolver which IP address serves shop.example.',
   idea: 'Answers are cached for a time-to-live, so repeat visits skip this hop.', metrics: {dns: 20}},
  {title: 'Ask the server', tag: 'technique', show: ['you', 'dns', 'server'], links: ['you-server'],
   hops: [['you', 'server', 60], ['server', 'you', 60, 'response']],
   body: 'One round trip opens the connection, a second carries the request and the page.',
   idea: 'Distance sets the floor: a round trip cannot beat the speed of light.', metrics: {dns: 20, connect: 60, request: 60}},
  {title: 'The slow part: a query', tag: 'insight', show: ['you', 'dns', 'server', 'db'], links: ['you-server', 'server-db'],
   hops: [['server', 'db', 180], ['db', 'server', 180, 'response']],
   body: 'The server waits on an unindexed database query before it can answer.',
   idea: 'Measure before optimising: here the query, not the network, dominates.', metrics: {dns: 20, connect: 60, request: 60, query: 360}},
];
const CHIPS = [['dns', 'DNS lookup'], ['connect', 'Connect'], ['request', 'Request'], ['query', 'DB query'], ['total', 'Total']];

// ---------- rendering: state → DOM, idempotent; motion comes from CSS and one rAF loop ----------
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
let current = 0, paused = false, run = 0, prevMetrics = {};
const $ = id => document.getElementById(id);

function renderChips(m) {
  const total = Object.values(m).reduce((a, b) => a + b, 0);
  const values = {...m, total: total || undefined};
  $('metrics').replaceChildren(...CHIPS.map(([k, name]) => {
    const c = document.createElement('div');
    c.className = 'chip' + (values[k] !== undefined && values[k] !== prevMetrics[k] ? ' changed' : '');
    c.innerHTML = `<small>${name}</small><b>${values[k] === undefined ? '—' : values[k] + ' ms'}</b>`;
    return c;
  }));
  prevMetrics = values;
}

function spotlight(id) {
  const [x, y] = anchor[id];
  const ring = el('ellipse', {class: 'spot', cx: x, cy: y + 12, rx: 60, ry: 30, fill: 'none',
                              stroke: 'var(--rust)', 'stroke-width': 2}, $('fx'));
  ring.addEventListener('animationend', () => ring.remove());
}

// packets travel hop by hop; duration scales with the hop's latency so the motion *is* the data
async function playHops(hops, token) {
  for (const [a, b, ms, kind] of hops || []) {
    if (token !== run) return;
    const [x1, y1] = anchor[a], [x2, y2] = anchor[b];
    const dot = el('circle', {class: 'packet' + (kind ? ' ' + kind : ''), r: 5, cx: x1, cy: y1}, $('fx'));
    const duration = reduced.matches ? 0 : 500 + ms * 3;
    let elapsed = 0, last = performance.now();
    await new Promise(done => {
      const frame = now => {
        if (token !== run) { dot.remove(); return done(); }
        if (!paused) elapsed += now - last;
        last = now;
        const t = duration ? Math.min(1, elapsed / duration) : 1;
        const e = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;   // ease-in-out cubic
        dot.setAttribute('cx', x1 + (x2 - x1) * e);
        dot.setAttribute('cy', y1 + (y2 - y1) * e);
        if (t < 1) requestAnimationFrame(frame); else { dot.remove(); done(); }
      };
      requestAnimationFrame(frame);
    });
  }
}

function go(index) {
  const prev = current;
  current = Math.max(0, Math.min(STEPS.length - 1, index));
  const step = STEPS[current], token = ++run;
  $('fx').replaceChildren();
  for (const [id, g] of Object.entries(nodeEl)) {
    const on = step.show.includes(id);
    if (on && g.classList.contains('off')) spotlight(id);   // newly introduced → draw the eye
    g.classList.toggle('off', !on);
  }
  for (const [id, l] of Object.entries(linkEl)) l.classList.toggle('off', !step.links.includes(id));
  renderChips(step.metrics);
  $('counter').textContent = `STEP ${current + 1} / ${STEPS.length}`;
  $('tag').textContent = step.tag.toUpperCase();
  const copy = $('copy');
  copy.style.setProperty('--slide', (current >= prev ? 12 : -12) + 'px');   // slide in the travel direction
  copy.innerHTML = `<h2 id="step-title"></h2><p></p><div class="idea"><small>KEY IDEA</small><span></span></div>`;
  copy.querySelector('h2').textContent = step.title;
  copy.querySelector('p').textContent = step.body;
  copy.querySelector('.idea span').textContent = step.idea;
  $('back').disabled = current === 0;
  $('next').textContent = current < STEPS.length - 1 ? `Next: ${STEPS[current + 1].title} →` : 'Restart ↺';
  [...$('stepper').children].forEach((b, i) => {
    b.toggleAttribute('aria-current', i === current); if (i === current) b.setAttribute('aria-current', 'step');
    b.classList.toggle('done', i < current);
  });
  history.replaceState(null, '', '#step-' + (current + 1));
  playHops(step.hops, token);
}

STEPS.forEach((s, i) => {
  const b = document.createElement('button');
  b.textContent = i + 1; b.title = s.title; b.onclick = () => go(i);
  $('stepper').append(b);
});
$('back').onclick = () => go(current - 1);
$('next').onclick = () => go(current < STEPS.length - 1 ? current + 1 : 0);
$('replay').onclick = () => go(current);
$('pause').onclick = () => { paused = !paused; $('pause').setAttribute('aria-pressed', paused); $('pause').textContent = paused ? 'Play' : 'Pause'; };
$('theme').onclick = () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark'; };
addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,[contenteditable]')) return;
  if (e.key === 'ArrowRight') go(current + 1);
  else if (e.key === 'ArrowLeft') go(current - 1);
  else if (e.key.toLowerCase() === 'r') go(current);
  else if (e.key === ' ') { e.preventDefault(); $('pause').click(); }
});
go((parseInt(location.hash.replace('#step-', ''), 10) || 1) - 1);
</script>
</body>
</html>
