name: ZIP upload from owner issue

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: zip-upload-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[ZIP Upload]') &&
      contains(github.event.issue.body, '<!-- zip-upload-request:v1 -->')
    runs-on: ubuntu-latest
    steps:
      - name: Check out Hugo branch
        uses: actions/checkout@v4
        with:
          ref: hugo
          fetch-depth: 0

      - name: Download, validate and extract archive
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: python
        run: |
          import os, re, shutil, stat, sys, urllib.request, zipfile
          from pathlib import Path, PurePosixPath

          body = os.environ["ISSUE_BODY"]
          def field(name):
              match = re.search(rf"^- {re.escape(name)}: `([^`]*)`\s*$", body, re.M)
              if not match:
                  raise SystemExit(f"Missing {name} field")
              return match.group(1).strip()

          destination = field("Destination")
          mode = field("Mode")
          message = field("Commit message")
          if destination == ".": destination = ""
          parts = PurePosixPath(destination).parts if destination else ()
          if any(p in ("", ".", "..", ".git") for p in parts):
              raise SystemExit("Unsafe destination")
          if mode not in ("merge", "replace"):
              raise SystemExit("Unsupported mode")
          if mode == "replace" and not destination:
              raise SystemExit("Replacing the repository root is not allowed")

          urls = re.findall(r"https://github\.com/user-attachments/(?:files|assets)/[A-Za-z0-9._/?=&%-]+", body)
          if len(urls) != 1:
              raise SystemExit(f"Expected exactly one GitHub ZIP attachment, found {len(urls)}")
          request = urllib.request.Request(urls[0], headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/octet-stream", "User-Agent": "zip-upload-action"})
          with urllib.request.urlopen(request, timeout=60) as response:
              data = response.read(100 * 1024 * 1024 + 1)
          if len(data) > 100 * 1024 * 1024:
              raise SystemExit("ZIP exceeds 100 MiB")
          Path("/tmp/upload.zip").write_bytes(data)

          target = Path(destination or ".").resolve()
          root = Path.cwd().resolve()
          if root not in (target, *target.parents):
              raise SystemExit("Destination escapes repository")
          if mode == "replace" and target != root and target.exists():
              shutil.rmtree(target)
          target.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile("/tmp/upload.zip") as archive:
              files = [i for i in archive.infolist() if not i.is_dir()]
              if not files or len(files) > 1000:
                  raise SystemExit("ZIP must contain 1–1000 files")
              if sum(i.file_size for i in files) > 250 * 1024 * 1024:
                  raise SystemExit("Expanded ZIP exceeds 250 MiB")
              for item in files:
                  path = PurePosixPath(item.filename.replace("\\", "/"))
                  if path.is_absolute() or any(p in ("", ".", "..", ".git") for p in path.parts):
                      raise SystemExit(f"Unsafe archive path: {item.filename}")
                  if stat.S_ISLNK(item.external_attr >> 16):
                      raise SystemExit(f"Symbolic links are not allowed: {item.filename}")
                  output = (target / Path(*path.parts)).resolve()
                  if target not in output.parents:
                      raise SystemExit(f"Archive path escapes destination: {item.filename}")
                  output.parent.mkdir(parents=True, exist_ok=True)
                  with archive.open(item) as source, output.open("wb") as dest:
                      shutil.copyfileobj(source, dest)
          Path("/tmp/commit-message.txt").write_text(message or "Upload ZIP through GitHub Issue")

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -F /tmp/commit-message.txt
          git push origin HEAD:hugo
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report success
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          SHA: ${{ steps.commit.outputs.sha }}
          CHANGED: ${{ steps.commit.outputs.changed }}
        run: |
          if [ "$CHANGED" = "true" ]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Published to \`hugo\` in commit \`$SHA\`."
          else
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "The archive produced no repository changes."
          fi
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY"
