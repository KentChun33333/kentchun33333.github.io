version: 1
default_axis: sg_gov
method:
  coordinate: "Normalized responsibility level (0–100); compensation never determines the coordinate by itself."
  projection: "Direct anchor edges are preferred; otherwise a node is assigned to the nearest primary-axis responsibility level."
  folding: "Every primary-axis grade gets one row. Every non-primary grade is rendered once and multiple grades may stack in one row."

