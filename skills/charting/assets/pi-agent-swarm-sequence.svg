<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Agent Swarm with Pi — sequence flow</title>
  <desc id="desc">Reference design: a user gives Pi a goal, Pi delegates independent tasks through a subagent extension to separate Pi processes, each runs its own model and tool loop, results return to Pi for synthesis, verification and delivery. Independent contexts do not imply filesystem isolation.</desc>
  <defs>
    <marker id="call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" stroke="#222222" fill="#222222" stroke-width="1.3" />
    </marker>
    <marker id="return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" stroke="#777777" fill="none" stroke-width="1.3" />
    </marker>
  </defs>
  <style>text { font-family: Arial, Helvetica, sans-serif; fill: #222222; } .message { font-size:17px; paint-order:stroke; stroke:#ffffff; stroke-width:7px; stroke-linejoin:round; }</style>
  <rect width="1600" height="900" fill="#ffffff" />
  <text x="70" y="62" font-size="22" text-anchor="start" style="fill:#2AA79E" font-weight="700">pi / AGENT SWARM</text>
  <text x="925" y="62" font-size="30" text-anchor="middle" style="fill:#222222" font-weight="700">Agent Swarm with Pi — Sequence Flow</text>
  <text x="925" y="91" font-size="18" text-anchor="middle" style="fill:#666666">Reference design · official subagent extension · independent tasks shown in parallel</text>
  <rect x="268" y="122" width="164" height="72" fill="#F7F7F7" stroke="#D9D9D9" stroke-width="1" />
  <text x="350" y="153" font-size="24" text-anchor="middle" style="fill:#222222" font-weight="700">User</text>
  <text x="350" y="178" font-size="15" text-anchor="middle" style="fill:#666666">Goal + constraints</text>
  <rect x="488" y="122" width="164" height="72" fill="#F7F7F7" stroke="#D9D9D9" stroke-width="1" />
  <text x="570" y="153" font-size="24" text-anchor="middle" style="fill:#222222" font-weight="700">Pi lead</text>
  <text x="570" y="178" font-size="15" text-anchor="middle" style="fill:#666666">Plan + synthesize</text>
  <rect x="708" y="122" width="164" height="72" fill="#F7F7F7" stroke="#D9D9D9" stroke-width="1" />
  <text x="790" y="153" font-size="24" text-anchor="middle" style="fill:#222222" font-weight="700">Subagent ext.</text>
  <text x="790" y="178" font-size="15" text-anchor="middle" style="fill:#666666">Dispatch + collect</text>
  <rect x="928" y="122" width="164" height="72" fill="#F7F7F7" stroke="#D9D9D9" stroke-width="1" />
  <text x="1010" y="153" font-size="24" text-anchor="middle" style="fill:#222222" font-weight="700">Pi agent A</text>
  <text x="1010" y="178" font-size="15" text-anchor="middle" style="fill:#666666">Own model + tools</text>
  <rect x="1148" y="122" width="164" height="72" fill="#F7F7F7" stroke="#D9D9D9" stroke-width="1" />
  <text x="1230" y="153" font-size="24" text-anchor="middle" style="fill:#222222" font-weight="700">Pi agent B</text>
  <text x="1230" y="178" font-size="15" text-anchor="middle" style="fill:#666666">Own model + tools</text>
  <rect x="1368" y="122" width="164" height="72" fill="#F7F7F7" stroke="#D9D9D9" stroke-width="1" />
  <text x="1450" y="153" font-size="24" text-anchor="middle" style="fill:#222222" font-weight="700">Workspace</text>
  <text x="1450" y="178" font-size="15" text-anchor="middle" style="fill:#666666">Files + commands</text>
  <rect x="70" y="210" width="180" height="90" fill="#E4F3F8" stroke="#B7DDE8" stroke-width="1" />
  <text x="82" y="237" font-size="18" text-anchor="start" style="fill:#222222" font-weight="700">01  Scope</text>
  <text x="82" y="262" font-size="15" text-anchor="start" style="fill:#222222">Define success.</text>
  <text x="82" y="285" font-size="15" text-anchor="start" style="fill:#222222">Split independent tasks.</text>
  <rect x="70" y="310" width="180" height="305" fill="#FFF2CC" stroke="#E6D79E" stroke-width="1" />
  <text x="82" y="337" font-size="18" text-anchor="start" style="fill:#222222" font-weight="700">02  Parallel work</text>
  <text x="82" y="362" font-size="15" text-anchor="start" style="fill:#222222">Each child is a separate</text>
  <text x="82" y="385" font-size="15" text-anchor="start" style="fill:#222222">Pi process with its own</text>
  <text x="82" y="408" font-size="15" text-anchor="start" style="fill:#222222">context and tool loop.</text>
  <text x="82" y="431" font-size="15" text-anchor="start" style="fill:#222222" />
  <text x="82" y="454" font-size="15" text-anchor="start" style="fill:#222222">Contexts are isolated;</text>
  <text x="82" y="477" font-size="15" text-anchor="start" style="fill:#222222">files need configured</text>
  <text x="82" y="500" font-size="15" text-anchor="start" style="fill:#222222">folder/worktree isolation.</text>
  <rect x="70" y="620" width="180" height="62" fill="#FBE3E5" stroke="#E1B2B9" stroke-width="1" />
  <text x="82" y="647" font-size="18" text-anchor="start" style="fill:#222222" font-weight="700">03  Synthesize</text>
  <text x="82" y="672" font-size="15" text-anchor="start" style="fill:#222222">Join + resolve gaps.</text>
  <rect x="70" y="687" width="180" height="125" fill="#EAF4E2" stroke="#C8DDB9" stroke-width="1" />
  <text x="82" y="714" font-size="18" text-anchor="start" style="fill:#222222" font-weight="700">04  Verify + deliver</text>
  <text x="82" y="739" font-size="15" text-anchor="start" style="fill:#222222">Run the required checks.</text>
  <text x="82" y="762" font-size="15" text-anchor="start" style="fill:#222222">Revise + repeat on failure.</text>
  <text x="82" y="785" font-size="15" text-anchor="start" style="fill:#222222">Return result + evidence.</text>
  <line fill="none" stroke="#D6A15E" stroke-width="1.1" stroke-dasharray="5 5" x1="350" y1="194" x2="350" y2="814" />
  <line fill="none" stroke="#D6A15E" stroke-width="1.1" stroke-dasharray="5 5" x1="570" y1="194" x2="570" y2="814" />
  <line fill="none" stroke="#D6A15E" stroke-width="1.1" stroke-dasharray="5 5" x1="790" y1="194" x2="790" y2="814" />
  <line fill="none" stroke="#D6A15E" stroke-width="1.1" stroke-dasharray="5 5" x1="1010" y1="194" x2="1010" y2="814" />
  <line fill="none" stroke="#D6A15E" stroke-width="1.1" stroke-dasharray="5 5" x1="1230" y1="194" x2="1230" y2="814" />
  <line fill="none" stroke="#D6A15E" stroke-width="1.1" stroke-dasharray="5 5" x1="1450" y1="194" x2="1450" y2="814" />
  <rect x="562" y="225" width="16" height="580" fill="#55C7BE" stroke="#2AA79E" stroke-width="1" />
  <rect x="782" y="263" width="16" height="340" fill="#55C7BE" stroke="#2AA79E" stroke-width="1" />
  <rect x="1002" y="350" width="16" height="182" fill="#55C7BE" stroke="#2AA79E" stroke-width="1" />
  <rect x="1222" y="390" width="16" height="175" fill="#55C7BE" stroke="#2AA79E" stroke-width="1" />
  <rect x="1442" y="429" width="16" height="65" fill="#55C7BE" stroke="#2AA79E" stroke-width="1" />
  <rect x="1442" y="704" width="16" height="48" fill="#55C7BE" stroke="#2AA79E" stroke-width="1" />
  <rect x="764" y="311" width="766" height="305" fill="none" stroke="#C6CBD1" stroke-width="1" />
  <rect x="764" y="311" width="190" height="29" fill="#F7F7F7" stroke="#C6CBD1" stroke-width="1" />
  <text x="776" y="332" font-size="15" text-anchor="start" style="fill:#222222" font-weight="700">par · independent tasks</text>
  <text x="1050" y="332" font-size="15" text-anchor="start" style="fill:#666666">Each agent repeats: model → tool → model</text>
  <line fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#call)" x1="358" y1="230" x2="562" y2="230" />
  <text x="460.0" y="220" text-anchor="middle" class="message" style="fill:#222222">1: goal + constraints</text>
  <line fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#call)" x1="578" y1="270" x2="782" y2="270" />
  <text x="680.0" y="260" text-anchor="middle" class="message" style="fill:#222222">2: delegate tasks</text>
  <text x="965" y="298" font-size="15" text-anchor="start" style="fill:#666666">Role prompts + tool lists + model choices travel with each task.</text>
  <line fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#call)" x1="798" y1="365" x2="1002" y2="365" />
  <text x="900.0" y="355" text-anchor="middle" class="message" style="fill:#222222">3a: start task A</text>
  <line fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#call)" x1="798" y1="395" x2="1222" y2="395" />
  <text x="1010.0" y="385" text-anchor="middle" class="message" style="fill:#222222">3b: start task B</text>
  <line fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#call)" x1="1018" y1="438" x2="1442" y2="438" />
  <text x="1230.0" y="428" text-anchor="middle" class="message" style="fill:#222222">4a: read / edit / run</text>
  <line fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#call)" x1="1238" y1="478" x2="1442" y2="478" />
  <text x="1340.0" y="468" text-anchor="middle" class="message" style="fill:#222222">4b: tool actions</text>
  <line fill="none" stroke="#777777" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#return)" x1="1002" y1="528" x2="798" y2="528" />
  <text x="900.0" y="518" text-anchor="middle" class="message" style="fill:#777777">5a: task A result</text>
  <line fill="none" stroke="#777777" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#return)" x1="1222" y1="568" x2="798" y2="568" />
  <text x="1010.0" y="558" text-anchor="middle" class="message" style="fill:#777777">5b: task B result</text>
  <line fill="none" stroke="#777777" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#return)" x1="782" y1="604" x2="578" y2="604" />
  <text x="680.0" y="594" text-anchor="middle" class="message" style="fill:#777777">6: results + status</text>
  <path fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#call)" d="M 578 639 L 645 639 L 645 661 L 578 661" />
  <text x="667" y="654" font-size="17" text-anchor="start" style="fill:#222222">7: reconcile outputs + address gaps</text>
  <line fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#call)" x1="578" y1="708" x2="1442" y2="708" />
  <text x="1010.0" y="698" text-anchor="middle" class="message" style="fill:#222222">8: verify the combined outcome</text>
  <line fill="none" stroke="#777777" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#return)" x1="1442" y1="750" x2="578" y2="750" />
  <text x="1010.0" y="740" text-anchor="middle" class="message" style="fill:#777777">9: check results + evidence</text>
  <line fill="none" stroke="#777777" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#return)" x1="562" y1="799" x2="358" y2="799" />
  <text x="460.0" y="789" text-anchor="middle" class="message" style="fill:#777777">10: final outcome</text>
  <line fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#call)" x1="70" y1="842" x2="118" y2="842" />
  <text x="132" y="848" font-size="15" text-anchor="start" style="fill:#222222">Call / action</text>
  <line fill="none" stroke="#777777" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#return)" x1="295" y1="842" x2="343" y2="842" />
  <text x="357" y="848" font-size="15" text-anchor="start" style="fill:#222222">Return / status</text>
  <rect x="545" y="829" width="10" height="27" fill="#55C7BE" stroke="#2AA79E" stroke-width="1" />
  <text x="568" y="848" font-size="15" text-anchor="start" style="fill:#222222">Active</text>
  <text x="735" y="848" font-size="16" text-anchor="start" style="fill:#666666">Dependent work uses a chain; this slide shows parallel fan-out / fan-in.</text>
  <text x="70" y="880" font-size="14" text-anchor="start" style="fill:#777777">Reference architecture, not an installed Pi integration. Pi core needs an extension/package for subagents.</text>
  <text x="1210" y="880" font-size="14" text-anchor="start" style="fill:#777777">Source: Pi official subagent example</text>
</svg>